<title>PowerGit Graph Navigation</title>
<style>
  :root {
    --surface: #ffffff; --surface-alt: #eef1f5; --sunken: #f6f8fb;
    --text: #101827; --text-2: #334155; --meta: #5b6778; --disabled: #64748b;
    --border: #d6dce5; --border-soft: #e6eaf0;
    --primary: #1553c9; --on-primary: #fff; --primary-soft: rgba(21, 83, 201, 0.10);
    --sel-bg: #dbeafe; --sel-border: #2563eb; --hover: rgba(37, 99, 235, 0.08); --focus: #2563eb;
    --page: #e3e7ee; --shadow: 0 18px 48px rgba(16, 24, 39, 0.26); --menu-shadow: 0 6px 24px rgba(16, 24, 39, 0.18);
    /* Git Extensions lane set, theme/tokens.ts */
    --lane1: #f064a0; --lane2: #78b4e6; --lane3: #24c221; --lane4: #a078f0; --lane5: #dd3228; --lane6: #1ac6a6; --lane7: #e7b00f; --head-outline: #1a1a1a;
    --ref-local-bg: #eff6ff; --ref-local-fg: #2563eb; --ref-remote-bg: #ecfdf5; --ref-remote-fg: #059669;
    --ref-tag-bg: #f5f3ff; --ref-tag-fg: #6d28d9; --ref-head-bg: #fef2f2; --ref-head-fg: #dc2626;
    --tip-bg: #101827; --tip-fg: #ffffff;
    --mono: "Fira Code", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #182029; --surface-alt: #10161e; --sunken: #141b23;
      --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
      --border: #2a3340; --border-soft: #222a35;
      --primary: #3b7bff; --on-primary: #0b1220; --primary-soft: rgba(59, 123, 255, 0.16);
      --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #93c5fd;
      --page: #0c1117; --shadow: 0 18px 48px rgba(0, 0, 0, 0.55); --menu-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      --lane1: #f47db1; --lane2: #82bdf0; --lane3: #3ad636; --lane4: #b08cf7; --lane5: #f0655a; --lane6: #2bd4b4; --lane7: #f0be2a; --head-outline: #f1f3f6;
      --ref-local-bg: #1f3a5f; --ref-local-fg: #bfdbfe; --ref-remote-bg: #0b3d2e; --ref-remote-fg: #86efac;
      --ref-tag-bg: #2e1f5e; --ref-tag-fg: #ddd6fe; --ref-head-bg: #4a1d1d; --ref-head-fg: #fecaca;
      --tip-bg: #e6e9ef; --tip-fg: #10161e;
    }
  }
  :root[data-theme="dark"] {
    --surface: #182029; --surface-alt: #10161e; --sunken: #141b23;
    --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
    --border: #2a3340; --border-soft: #222a35;
    --primary: #3b7bff; --on-primary: #0b1220; --primary-soft: rgba(59, 123, 255, 0.16);
    --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #93c5fd;
    --page: #0c1117; --shadow: 0 18px 48px rgba(0, 0, 0, 0.55); --menu-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    --lane1: #f47db1; --lane2: #82bdf0; --lane3: #3ad636; --lane4: #b08cf7; --lane5: #f0655a; --lane6: #2bd4b4; --lane7: #f0be2a; --head-outline: #f1f3f6;
    --ref-local-bg: #1f3a5f; --ref-local-fg: #bfdbfe; --ref-remote-bg: #0b3d2e; --ref-remote-fg: #86efac;
    --ref-tag-bg: #2e1f5e; --ref-tag-fg: #ddd6fe; --ref-head-bg: #4a1d1d; --ref-head-fg: #fecaca;
    --tip-bg: #e6e9ef; --tip-fg: #10161e;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Ubuntu", sans-serif; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  svg { display: block; }
  kbd { font: inherit; font-size: 10.5px; font-family: var(--mono); padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface); color: var(--meta); line-height: 15px; }
  code { font-family: var(--mono); font-size: 12px; }

  /* ---------- page chrome ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 9px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
  .top .sub { color: var(--meta); font-size: 12px; }
  .right { display: flex; gap: 10px; margin-left: auto; align-items: center; }
  .switch { display: flex; gap: 4px; }
  .switch button, .theme button { border: 1px solid var(--border); background: var(--surface); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  .switch button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .switch button b { font-weight: 700; margin-right: 6px; }
  .switch.states button { font-size: 12px; padding: 3px 9px; }
  .switch.states button.on { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .switch .cap { font-size: 12px; color: var(--meta); align-self: center; margin-right: 2px; }
  .theme { display: flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .theme button { border: 0; border-left: 1px solid var(--border); border-radius: 0; padding: 4px 9px; color: var(--meta); }
  .theme button:first-child { border-left: 0; }
  .theme button.on { color: var(--text); background: var(--surface-alt); }
  main { padding: 20px 20px 56px; }
  .lead { max-width: 78ch; margin: 0 auto 14px; color: var(--text-2); }
  .lead h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 6px; text-wrap: balance; }
  .lead p { margin: 0 0 6px; }
  .lead b { color: var(--text); font-weight: 600; }
  .lead .quote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--meta); font-style: italic; margin: 8px 0; }
  .notes { max-width: 1180px; margin: 16px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .notes h3 { font-size: 12px; font-weight: 600; color: var(--meta); margin: 0 0 6px; }
  .notes ol, .notes ul { margin: 0; padding: 0; list-style: none; color: var(--text-2); }
  .notes li { display: flex; gap: 9px; margin: 0 0 7px; }
  .notes li .mark { flex: none; margin-top: 1px; }
  .notes li b { color: var(--text); font-weight: 600; }
  .mark { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: 10.5px; font-weight: 700; line-height: 1; font-style: normal; }
  .qbox { max-width: 1180px; margin: 18px auto 0; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 12.5px; color: var(--text-2); }
  .qbox b { color: var(--text); }
  .qbox ul { margin: 4px 0 0; padding-left: 18px; }
  @media (max-width: 800px) { .notes { grid-template-columns: 1fr; } }

  /* ---------- the window (1280 × 760 stage) ---------- */
  .win-wrap { overflow-x: auto; }
  .win { width: 1280px; max-width: 100%; height: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 14px 40px rgba(16, 24, 39, 0.22); display: grid; grid-template-rows: 30px 1fr 22px; position: relative; user-select: none; }
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--meta); }
  .titlebar .word { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .titlebar .word i { width: 12px; height: 12px; background: var(--primary); display: inline-block; clip-path: polygon(0 0, 40% 0, 100% 100%, 60% 100%); }
  .titlebar .hair { width: 1px; height: 14px; background: var(--border); }
  .titlebar .wc { margin-left: auto; display: flex; gap: 18px; color: var(--meta); font-size: 11px; }
  .shell { display: grid; grid-template-columns: 188px 240px 1fr; min-height: 0; }
  .status { display: flex; align-items: center; gap: 12px; padding: 0 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--meta); }
  .status .br { color: var(--primary); font-weight: 500; }
  .status .sp { flex: 1; }
  .rail { border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 6px 0; font-size: 12.5px; min-height: 0; }
  .ri { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 14px; color: var(--text); white-space: nowrap; }
  .ri svg { width: 17px; height: 17px; fill: currentColor; color: var(--meta); flex: none; }
  .ri .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .ri .chev { width: 14px; height: 14px; color: var(--meta); }
  .ri .cnt { display: inline-grid; place-items: center; min-width: 17px; height: 17px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 10.5px; font-weight: 700; padding: 0 5px; }
  .ri.gap { margin-top: 8px; }
  .ri.commit svg { color: var(--on-primary); background: var(--primary); border-radius: 5px; padding: 2px; width: 20px; height: 20px; }
  .rail .grow { flex: 1; }
  .left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; font-size: 12.5px; }
  .left .head { display: flex; align-items: center; height: 38px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; gap: 6px; }
  .left .head .sp { flex: 1; }
  .left .head svg { width: 16px; height: 16px; fill: currentColor; color: var(--meta); }
  .left .search { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-bottom: 1px solid var(--border); color: var(--disabled); background: var(--sunken); }
  .left .search svg { width: 14px; height: 14px; fill: currentColor; }
  .tree { flex: 1; overflow: hidden; padding-top: 2px; }
  .trow { display: flex; align-items: center; height: 22px; padding-right: 6px; white-space: nowrap; color: var(--text); }
  .trow.sec { color: var(--meta); font-weight: 500; }
  .trow.cur { background: var(--sel-bg); }
  .trow.cur .lbl, .trow.cur .ico { color: var(--primary); font-weight: 700; }
  .slot { width: 16px; flex: none; display: inline-grid; place-items: center; color: var(--meta); }
  .slot svg { width: 15px; height: 15px; fill: currentColor; }
  .ico { width: 16px; flex: none; display: inline-grid; place-items: center; margin-right: 4px; color: var(--meta); }
  .ico svg { width: 13px; height: 13px; fill: currentColor; }
  .trow .lbl { overflow: hidden; text-overflow: ellipsis; }
  .rightp { display: grid; grid-template-rows: 1fr 6px 150px; min-height: 0; min-width: 0; }
  .grid { display: grid; grid-template-rows: 28px 1fr; min-height: 0; position: relative; }
  .ghead, .row { display: grid; grid-template-columns: 96px 1fr 154px 142px 86px; align-items: center; padding-right: 16px; }
  .ghead { font-size: 12px; font-weight: 500; color: var(--meta); border-bottom: 1px solid var(--border-soft); position: relative; }
  .ghead > div { padding-left: 8px; height: 100%; display: flex; align-items: center; border-left: 1px solid var(--border-soft); position: relative; }
  .ghead > div:first-child { border-left: 0; padding-left: 16px; }
  .gbody { overflow: hidden; position: relative; }
  .gsvg { position: absolute; top: 0; left: 2px; z-index: 1; pointer-events: none; }
  .row { height: 28px; border-left: 2px solid transparent; cursor: default; position: relative; }
  .row > .cell { height: 100%; display: flex; align-items: center; min-width: 0; white-space: nowrap; }
  .row:hover:not(.selected) > .cell { background: var(--hover); }
  .row.selected { border-left-color: var(--sel-border); background: var(--sel-bg); }
  .row.tail .cell { color: var(--meta); font-size: 12px; gap: 8px; }
  .msg { padding-left: 12px; gap: 6px; overflow: hidden; }
  .msg-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-text.wd { font-style: italic; color: var(--text-2); }
  .author, .date, .sha { color: var(--meta); font-size: 12px; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; }
  .author { padding-left: 8px; gap: 7px; }
  .disc { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 9.5px; font-weight: 700; flex: none; background: var(--ref-local-bg); color: var(--ref-local-fg); }
  .disc.hw { background: var(--ref-remote-bg); color: var(--ref-remote-fg); }
  .date { padding-left: 8px; }
  .sha { font-family: var(--mono); font-size: 11px; justify-content: flex-end; padding-right: 8px; }
  .split { background: var(--page); }
  .bottom { border-top: 1px solid var(--border); padding: 0 16px; font-size: 12.5px; overflow: hidden; }
  .bottom .tabs2 { display: flex; gap: 18px; height: 34px; align-items: center; color: var(--meta); border-bottom: 1px solid var(--border-soft); margin-bottom: 8px; }
  .bottom .tabs2 b { color: var(--primary); font-weight: 500; box-shadow: inset 0 -2px 0 var(--primary); padding: 8px 0; }
  .bottom h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom p { margin: 0 0 3px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ref { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; height: 16px; border-radius: 999px; font-size: 10px; font-weight: 600; background: var(--ref-local-bg); color: var(--ref-local-fg); white-space: nowrap; }
  .ref svg { width: 11px; height: 11px; fill: currentColor; flex: none; }
  .ref.remote { background: var(--ref-remote-bg); color: var(--ref-remote-fg); }
  .ref.tag { background: var(--ref-tag-bg); color: var(--ref-tag-fg); }
  .ref.head { background: var(--ref-head-bg); color: var(--ref-head-fg); }
  .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--primary); animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: var(--tip-bg); color: var(--tip-fg); padding: 6px 12px; border-radius: 5px; font-size: 12px; z-index: 9; opacity: 0; transition: opacity 120ms ease; pointer-events: none; }
  .toast.on { opacity: 1; }

  /* tooltips: CSS, so the disabled reasons show too (aria-disabled, not disabled) */
  [data-tip] { position: relative; }
  [data-tip]:hover::after, [data-tip]:focus-visible::after { content: attr(data-tip); position: absolute; z-index: 30; background: var(--tip-bg); color: var(--tip-fg); font-size: 11px; font-weight: 400; padding: 4px 8px; border-radius: 4px; white-space: nowrap; pointer-events: none; line-height: 1.3; }
  .tip-below[data-tip]:hover::after, .tip-below[data-tip]:focus-visible::after { top: 100%; right: 0; margin-top: 6px; }
  .tip-left[data-tip]:hover::after, .tip-left[data-tip]:focus-visible::after { right: 100%; top: 50%; transform: translateY(-50%); margin-right: 8px; }
  .tip-right[data-tip]:hover::after, .tip-right[data-tip]:focus-visible::after { left: 100%; top: 50%; transform: translateY(-50%); margin-left: 8px; }

  /* ---------- A: the header cluster ---------- */
  .cluster { position: absolute; right: 8px; top: 2px; height: 24px; display: flex; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); overflow: visible; }
  .nb { height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border: 0; border-left: 1px solid var(--border); background: transparent; color: var(--text-2); font-size: 11.5px; cursor: pointer; white-space: nowrap; }
  .nb:first-child { border-left: 0; border-radius: 4px 0 0 4px; }
  .nb:last-child { border-radius: 0 4px 4px 0; }
  .nb svg { width: 14px; height: 14px; fill: currentColor; }
  .nb:hover { background: var(--hover); color: var(--text); }
  .nb.lit { background: var(--primary-soft); color: var(--primary); }
  .nb.off { color: var(--disabled); opacity: 0.55; cursor: default; }
  .nb.off:hover { background: transparent; }
  .badge { display: inline-grid; place-items: center; min-width: 15px; height: 15px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 10px; font-weight: 700; padding: 0 4px; margin-left: 2px; }
  .nb .more { width: 12px; height: 12px; margin-left: -2px; opacity: 0.8; }
  .nb.split { padding-right: 4px; }
  .nb .spin { width: 11px; height: 11px; }

  /* the parents list (shared by A, B, C) */
  .plist { position: absolute; z-index: 25; min-width: 300px; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--menu-shadow); padding: 4px 0; font-size: 12.5px; }
  .plist .ph { padding: 4px 12px 5px; font-size: 11px; color: var(--meta); border-bottom: 1px solid var(--border-soft); margin-bottom: 3px; }
  .pi { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px; cursor: pointer; }
  .pi:hover { background: var(--hover); }
  .pi .n { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); display: inline-grid; place-items: center; font-size: 9.5px; color: var(--meta); flex: none; }
  .pi.first .n { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .pi .t { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pi kbd { margin-left: auto; }

  /* ---------- B: the compass pill, twin of the options pill ---------- */
  .pill { position: absolute; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 8px; opacity: 0.45; transition: all 120ms ease; border: 1px solid transparent; }
  .pill:hover, .pill.open { opacity: 1; background: var(--surface); border-color: var(--border); box-shadow: var(--menu-shadow); }
  .pill.options { left: 10px; bottom: 10px; }
  .pill.options svg { width: 18px; height: 18px; fill: var(--meta); }
  .pill.compass { right: 10px; bottom: 10px; flex-direction: column; gap: 4px; padding: 4px; }
  .cbtn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--text-2); position: relative; padding: 0; }
  .cbtn svg { width: 15px; height: 15px; fill: currentColor; }
  .pill:not(:hover):not(.open) .cbtn { background: transparent; border-color: transparent; }
  .cbtn:hover { background: var(--hover); color: var(--text); }
  .cbtn.lit { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .cbtn.off { color: var(--disabled); opacity: 0.5; cursor: default; }
  .cbtn .badge { position: absolute; right: -5px; top: -4px; cursor: pointer; }
  .cbtn .spin { width: 13px; height: 13px; }

  /* ---------- C: on the node ---------- */
  .nchev { position: absolute; width: 14px; height: 9px; border: 0; background: transparent; padding: 0; cursor: pointer; z-index: 3; display: none; place-items: center; }
  .nchev svg { width: 14px; height: 9px; fill: currentColor; }
  .row.selected .nchev, .row:hover .nchev { display: grid; }
  .nchev.off { opacity: 0.35; cursor: default; }
  .nchev .spin { width: 9px; height: 9px; border-width: 1.5px; }
  .hbtn { position: absolute; right: 6px; top: 4px; height: 20px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--meta); font-size: 11px; cursor: pointer; }
  .hbtn code { font-size: 11px; color: inherit; }
  .hbtn svg { width: 13px; height: 13px; fill: currentColor; }
  .hbtn:hover { background: var(--hover); color: var(--text); }
  .hbtn.lit { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); }
  .handle { position: absolute; right: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--border); }
</style>

<div class="top">
  <h1>Graph navigation</h1>
  <span class="sub">go to HEAD, to the child, to the parent — three places for the same three buttons</span>
  <div class="right">
    <div class="switch" id="variants"></div>
    <div class="switch states" id="states"></div>
    <div class="theme" id="theme"><button data-t="light">Light</button><button data-t="system" class="on">System</button><button data-t="dark">Dark</button></div>
  </div>
</div>

<main>
  <div class="lead" id="lead"></div>
  <div id="stage"></div>
  <div class="qbox" id="qbox"></div>
  <div class="notes" id="notes"></div>
</main>

<script>
const I = {

  const b = (what, icon) => { const on = what === 'head' ? true : what === 'child' ? canChild() : canParent() || state.loading; return `<button class="cbtn tip-left ${what === 'head' && state.selected === HEAD ? 'lit' : ''} ${on ? '' : 'off'}" data-nav="${what}" aria-disabled="${!on}" data-tip="${esc(tipFor(what))}">${state.loading && what === 'parent' ? '<span class="spin"></span>' : icon}${many && what === 'parent' ? `<span class="badge" data-parents="1">${ps.length}</span>` : ''}</button>`; };
  return `<div class="pill compass ${state.list ? 'open' : ''}" role="group" aria-label="Go to">${b('child', I.up)}${b('head', I.home)}${b('parent', I.down)}</div>`;
}
function nodeChevrons(c) {
  const x = 22 + c.lane * 16 - 7, ps = c.parents, col = LANE[c.lane];
  const up = `<button class="nchev tip-right ${canChild() ? '' : 'off'}" style="left:${x}px;top:1px;color:${col}" data-nav="child" aria-disabled="${!canChild()}" data-tip="${esc(tipFor('child'))}">${I.triUp}</button>`;
  if (state.loading) return up + `<button class="nchev tip-right" style="left:${x}px;top:19px;color:${col}" data-nav="parent" data-tip="${esc(tipFor('parent'))}"><span class="spin" style="border-top-color:${col}"></span></button>`;
  if (ps.length > 1) return up + ps.map((p, n) => `<button class="nchev tip-right" style="left:${x + (n === 0 ? -8 : 8)}px;top:19px;color:${col}" data-nav="parent" data-n="${n}" data-tip="Go to parent ${n + 1} ${p} — ${esc(byId()[p]?.msg.slice(0, 48) ?? '')}${n === 0 ? ' · ' + KEYS.parent : ''}">${I.triDown}</button>`).join('');
  return up + `<button class="nchev tip-right ${canParent() ? '' : 'off'}" style="left:${x}px;top:19px;color:${col}" data-nav="parent" aria-disabled="${!canParent()}" data-tip="${esc(tipFor('parent'))}">${I.triDown}</button>`;
}
function drawGraph() {
  const svg = $('gsvg'); if (!svg) return;
  const rows = rowsOf(), ids = byId();
  const els = [...$('rows').children];
  const total = $('rows').offsetHeight;
  svg.setAttribute('width', 96); svg.setAttribute('height', total); svg.style.height = total + 'px';
  const cy = Object.fromEntries(els.map((e) => [e.dataset.sha || 'x', e.offsetTop + e.offsetHeight / 2]));
  const x = (l) => 14 + (l + 0.5) * 16;
  let paths = '', nodes = '';
  if (cy.wd !== undefined) nodes += `<circle cx="${x(0)}" cy="${cy.wd}" r="5" fill="none" stroke="${LANE[0]}" stroke-width="1.5" stroke-dasharray="2 2"/><path d="M${x(0)} ${cy.wd + 5} L${x(0)} ${cy[HEAD]}" stroke="${LANE[0]}" stroke-width="2" stroke-dasharray="2 2" fill="none"/>`;
  if (state.st === 'first') paths += `<path d="M${x(0)} 0 L${x(0)} ${cy[rows[0].sha]}" stroke="${LANE[0]}" stroke-width="2"/>`;
  rows.forEach((c) => {
    const xc = x(c.lane), y0 = cy[c.sha];
    c.parents.forEach((p) => {
      const pc = ids[p];
      if (!pc) { paths += `<path d="M${xc} ${y0} L${xc} ${total}" stroke="${LANE[c.lane]}" stroke-width="2" fill="none"/>`; return; }
      const xp = x(pc.lane), y1 = cy[p];
      if (pc.lane === c.lane) paths += `<path d="M${xc} ${y0} L${xp} ${y1}" stroke="${LANE[c.lane]}" stroke-width="2"/>`;
      else { const ym = y0 + 28; paths += `<path d="M${xc} ${y0} C${xc} ${(y0 + ym) / 2} ${xp} ${(y0 + ym) / 2} ${xp} ${ym} L${xp} ${y1}" stroke="${LANE[pc.lane]}" stroke-width="2" fill="none"/>`; }
    });
  });
  rows.forEach((c) => {
    const xc = x(c.lane), y0 = cy[c.sha], f = LANE[c.lane], o = c.refs.includes('HEAD') ? `stroke="var(--head-outline)" stroke-width="2"` : '';
    nodes += c.refs.length ? `<rect x="${xc - 5}" y="${y0 - 5}" width="10" height="10" fill="${f}" ${o}/>` : `<circle cx="${xc}" cy="${y0}" r="5" fill="${f}" ${o}/>`;
  });
  svg.innerHTML = paths + nodes;
}
function plistHtml() {
  const c = cur(), ps = c.parents, ids = byId();
  return `<div class="plist" id="plist" role="menu"><div class="ph">${ps.length} parents of <code>${c.sha}</code> — Ctrl+P goes to the first</div>${ps.map((p, n) => `<div class="pi ${n === 0 ? 'first' : ''}" role="menuitem" data-go="${p}"><span class="n">${n + 1}</span><code>${p}</code><span class="t">${esc(ids[p]?.msg ?? '')}</span>${n === 0 ? '<kbd>Ctrl+P</kbd>' : ''}</div>`).join('')}</div>`;
}

/* ---------- render ---------- */
function render() {
  $('variants').innerHTML = Object.entries(VARIANTS).map(([k, t]) => `<button data-variant="${k}" class="${k === state.variant ? 'on' : ''}"><b>${k}</b>${t}</button>`).join('');
  $('states').innerHTML = `<span class="cap">State</span>` + Object.entries(STATES).map(([k, t]) => `<button data-state="${k}" class="${k === state.st ? 'on' : ''}">${t}</button>`).join('');
  renderLead(); renderStage(); renderNotes();
}
function renderLead() {
  const h = {
    A: `<h2>A · Header cluster — three buttons where the columns are named</h2><p class="quote">"When we're in the main graph, I'd like to have some sort of control buttons for 'go to head', 'go to successor' and 'go to parent'."</p>
      <p>A segmented group at the right end of the 28 px grid header: <b>HEAD</b>, <b>Child</b>, <b>Parent</b>, icon and a short word each, the Git Extensions keys in the tooltips (Ctrl+Shift+C, Ctrl+N, Ctrl+P). HEAD is tinted while the selection is HEAD. A button that has nowhere to go is dimmed and its tooltip says why ("No child in the loaded history", "No parent — first commit"). On a merge the Parent button wears the count and a chevron that opens the parents with their subjects — the click and Ctrl+P take the first parent, as GE does. Always visible, never in the way of the graph. <b>Recommended.</b></p>`,
    B: `<h2>B · Compass — a pill at the bottom-right, twin of the options pill</h2>
      <p>Three 28 px round buttons stacked Child · HEAD · Parent, floating over the graph body at the bottom-right exactly as the branch-history pill floats at the bottom-left: 45 % at rest, full on hover, the same border and shadow. Tooltips open to the left; the count badge on Parent opens the parents list. It reads as a navigation instrument rather than a toolbar, and the header stays as it is. Keyboard: <kbd>Ctrl+N</kbd> / <kbd>Ctrl+P</kbd> / <kbd>Ctrl+Shift+C</kbd>; <kbd>Alt+←</kbd> / <kbd>Alt+→</kbd> walk back and forth along the way you came.</p>`,
    C: `<h2>C · On the node — the graph itself grows the controls</h2>
      <p>The selected row's node sprouts two small lane-coloured chevrons, one above (child) and one below (parent), on the selected row and on hover; on a merge the lower chevron splits into two, one per parent, each tooltip naming its commit. HEAD is a small <code>⌂ 3363352</code> button in the Graph header cell, left of the column handle, lit when the selection is HEAD. Nothing new in the chrome; the affordance lives where the eye already is. The cost is discoverability — hover to find it.</p>`,
  }[state.variant];
  $('lead').innerHTML = h + `<p style="font-size:12px;color:var(--meta)">Every button works here: click, or use the keys. The <b>State</b> switch puts the selection at a commit, at HEAD, on a merge, on the first commit of the repository, or on the last loaded row whose parent is still being fetched.</p>`;
}
function renderStage() {
  $('stage').innerHTML = winHtml();
  const ov = $('overlay');
  if (state.list) {
    const ps = parentsOf(state.selected); if (ps.length < 2) state.list = false;
    else {
      ov.innerHTML = plistHtml();
      const win = $('win').getBoundingClientRect(), pl = $('plist');
      if (state.variant === 'A') { const b = document.querySelector('.cluster').getBoundingClientRect(); pl.style.right = (win.right - b.right) + 'px'; pl.style.top = (b.bottom - win.top + 4) + 'px'; }
      else if (state.variant === 'B') { const b = document.querySelector('.compass').getBoundingClientRect(); pl.style.right = (win.right - b.left + 8) + 'px'; pl.style.top = (b.bottom - win.top - pl.offsetHeight) + 'px'; }
      else { const r = document.querySelector('.row.selected').getBoundingClientRect(); pl.style.left = (r.left - win.left + 60) + 'px'; pl.style.top = (r.bottom - win.top + 2) + 'px'; }
    }
  }
  /* the end of history sits at the bottom of the body; a fetch in flight shows its tail row */
  const gb = $('gbody'), rs = $('rows');
  if (state.st === 'first') rs.style.paddingTop = Math.max(0, gb.clientHeight - rs.scrollHeight) + 'px';
  drawGraph();
  if (state.loading) gb.scrollTop = gb.scrollHeight;
}
function renderNotes() {
  const v = state.variant;
  const li = (n, s) => `<li><span class="mark">${n}</span><span>${s}</span></li>`, bl = (s) => `<li><span>${s}</span></li>`;
  let a = '', b = '';
  if (v === 'A') {
    a = li(1, `<b>Segmented, 24 px, in the header</b> — the header is chrome already (column names, the resize handles), so a control group there costs no graph space and is found at once. The SHA label yields to it; the column is self-evident.`) + li(2, `<b>States that speak:</b> lit HEAD, dimmed buttons with a reason, the "2" badge and chevron on a merge, a spinner while the parent is fetched.`) + li(3, `<b>The list</b> names each parent with its subject and marks the first; Ctrl+P always takes the first, the list is for the other one.`);
    b = bl(`<b>Component:</b> <code>GraphNav</code> rendered by <code>RevisionGrid</code>'s header; a pure <code>graphNav.ts</code> gives <code>childOf(rows, id)</code> (first loaded row listing it as a parent), <code>parentsOf</code>, and the reasons; keys registered in the browse layer's <code>commandItems</code> so they show in the menu too.`) + bl(`<b>Parent not loaded:</b> <code>selectRevision(sha)</code> already pages until a row is found (the ref-tree click does this); the button shows the spinner until the row arrives and scrolls into view.`) + bl(`<b>Cost:</b> a day: the model and its unit test, the header group, the keys, one e2e per state (child of HEAD, first commit, merge, paging).`);
  } else if (v === 'B') {
    a = li(1, `<b>The pill</b> reuses <code>GraphOptionsBar</code>'s recipe: absolute in the graph body, 45 % opacity at rest, border and shadow on hover, so it is one visual family with the options pill on the left.`) + li(2, `<b>Round buttons</b> read as directions (up, home, down) rather than words; the badge opens the parents list, which opens to the left so it never leaves the graph.`) + li(3, `<b>Alt+← / Alt+→</b> walk the history of selections, so Parent-Parent-Parent-back is one key.`);
    b = bl(`<b>Same model as A</b>; the pill is a sibling of <code>GraphOptionsBar</code> in <code>RevisionGrid</code>, and the two pills share the opacity/hover recipe as one small <code>FloatingPill</code> component.`) + bl(`<b>Cost:</b> A plus half a day for the pill and the history stack; the pill overlaps the last rows' SHA cells at rest (as the options pill overlaps the graph), which the tail row has to tolerate.`);
  } else {
    a = li(1, `<b>Chevrons in the lane</b>, 14 × 9 px, in the node's colour, only on the selected row and on hover: the graph canvas already draws there, so the affordance is a DOM overlay positioned from the layout's lane x.`) + li(2, `<b>Two chevrons on a merge</b>, one per parent, each tooltip naming its commit — the only variant where the second parent is one click and no list.`) + li(3, `<b>HEAD in the Graph header cell</b>: a small home button with the SHA in mono, lit when you are there; the column handle stays on its right.`);
    b = bl(`<b>Same model as A</b>; the overlay is a per-row absolute element inside the virtualized row, so it scrolls with it; on 150 % zoom the 9 px glyph is still 13 px — fine.`) + bl(`<b>Cost:</b> A plus a day: hit-testing next to the canvas, the split on merges, the header button; and a discoverability risk that the menu keys mitigate.`);
  }
  $('qbox').innerHTML = `<b>Questions for the owner</b><ul><li>Should <b>Go to child</b> prefer the child in the same lane (so walking up a branch stays on it) rather than GE's "first in the loaded graph"? The mock uses GE's rule.</li><li>On a merge, Ctrl+P goes to the first parent (GE). Is a second key wanted for the second parent (<kbd>Ctrl+Shift+P</kbd>), or is the list / the second chevron enough?</li><li>Is a selection history (<kbd>Alt+←</kbd> / <kbd>Alt+→</kbd>) wanted in every variant, or only where B proposes it? GE has none.</li><li>When the parent is not loaded, should the grid page silently until it arrives (as the ref tree does today) or stop after one page and say so?</li></ul>`;
  $('notes').innerHTML = `<div><h3>What you are looking at</h3><ol>${a}</ol></div><div><h3>How it would be built</h3><ul>${b}</ul></div>`;
}

/* ---------- interactions ---------- */
let toastTimer = null, loadTimer = null;
function toast(t) { const el = $('toast'); if (!el) return; el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1800); }
/* the way you came: a list of selections and a cursor; Alt+← / Alt+→ move the cursor */
function select(sha) {
  state.hist = state.hist.slice(0, state.hi + 1); state.hist.push(sha); state.hi = state.hist.length - 1;
  state.selected = sha; state.list = false; renderStage();
}
function walk(d) {
  const i = state.hi + d;
  if (i < 0 || i >= state.hist.length) return toast(d < 0 ? 'Nothing to go back to' : 'Nothing to go forward to');
  state.hi = i; state.selected = state.hist[i]; state.list = false; renderStage();
}
function setState(k) {
  state.st = k; state.list = false; state.loading = null; clearTimeout(loadTimer);
  state.selected = { commit: '4c62660', head: HEAD, merge: 'f15f6dd', first: 'a6a4eab', loading: 'eb2b7db' }[k];
  state.hist = [state.selected]; state.hi = 0;
  if (k === 'loading') state.loading = '61f5eb6';
  render();
}
function nav(what, n = 0) {
  const c = cur();
  if (what === 'head') { if (state.st === 'first') { toast('Scrolls 17,628 rows up to HEAD 3363352'); return; } if (c.sha === HEAD) return toast('Already at HEAD'); return select(HEAD); }
  if (what === 'child') { const k = childOf(c.sha); if (!k) return toast(state.st === 'first' ? 'The child bfcbc83 is above the loaded window — scrolls to it' : 'No child in the loaded history'); return select(k); }
  const ps = c.parents; if (!ps.length) return toast('No parent — this is the first commit');
  const p = ps[n] ?? ps[0];
  if (!byId()[p]) { state.loading = p; state.list = false; renderStage(); toast(`Loading history to ${p}…`); clearTimeout(loadTimer); loadTimer = setTimeout(() => { state.loading = null; renderStage(); toast(`${p} arrived — selected and scrolled into view`); }, 1600); return; }
  select(p);
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-variant],[data-state],[data-t],[data-parents],[data-nav],[data-go],[data-sha]');
  if (!t) { if (state.list) { state.list = false; renderStage(); } return; }
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.list = false; return render(); }
  if (t.dataset.state) return setState(t.dataset.state);
  if (t.dataset.t) { const v = t.dataset.t; document.documentElement.removeAttribute('data-theme'); if (v !== 'system') document.documentElement.setAttribute('data-theme', v); document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === v)); return; }
  if (t.dataset.parents) { e.stopPropagation(); state.list = !state.list; return renderStage(); }
  if (t.dataset.go) return select(t.dataset.go);
  if (t.dataset.nav) { if (t.getAttribute('aria-disabled') === 'true') return toast(t.dataset.tip); return nav(t.dataset.nav, +(t.dataset.n || 0)); }
  if (t.dataset.sha && t.dataset.sha !== 'wd' && t.dataset.sha !== 'tail') { if (t.dataset.sha !== state.selected) select(t.dataset.sha); }
});
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.ctrlKey && e.shiftKey && k === 'c') { e.preventDefault(); nav('head'); }
  else if (e.ctrlKey && !e.shiftKey && k === 'n') { e.preventDefault(); nav('child'); }
  else if (e.ctrlKey && !e.shiftKey && k === 'p') { e.preventDefault(); nav('parent'); }
  else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); walk(-1); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); walk(1); }
  else if (e.key === 'Escape' && state.list) { state.list = false; renderStage(); }
});
render();
</script>
