<!doctype html>
<meta charset="utf-8" />
<title>Recent repositories</title>
<style>
  :root {
    --surface: #ffffff; --surface-alt: #eef1f5; --sunken: #f6f8fb;
    --text: #101827; --text-2: #334155; --meta: #5b6778; --disabled: #64748b;
    --border: #d6dce5; --border-soft: #e6eaf0;
    --primary: #1553c9; --on-primary: #fff; --primary-soft: rgba(21, 83, 201, 0.10);
    --sel-bg: #dbeafe; --sel-border: #2563eb; --hover: rgba(37, 99, 235, 0.08); --focus: #2563eb;
    --page: #e3e7ee; --scrim: rgba(16, 24, 39, 0.28); --shadow: 0 18px 48px rgba(16, 24, 39, 0.26);
    --ref-local-bg: #eff6ff; --ref-local-fg: #2563eb;
    --ok: #059669; --warn: #a16207; --danger: #dc2626;
    /* the six badge pairs, reused as the repository colour (v0.18.1 device) */
    --d1-bg: #eff6ff; --d1-fg: #2563eb; --d2-bg: #ecfdf5; --d2-fg: #059669; --d3-bg: #f5f3ff; --d3-fg: #6d28d9;
    --d4-bg: #fef9c3; --d4-fg: #a16207; --d5-bg: #fef2f2; --d5-fg: #dc2626; --d6-bg: #f3f4f6; --d6-fg: #6b7280;
    --mono: "Fira Code", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #182029; --surface-alt: #10161e; --sunken: #141b23;
      --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
      --border: #2a3340; --border-soft: #222a35;
      --primary: #3b7bff; --on-primary: #0b1220; --primary-soft: rgba(59, 123, 255, 0.16);
      --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #93c5fd;
      --page: #0c1117; --scrim: rgba(0, 0, 0, 0.5); --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
      --ref-local-bg: #1f3a5f; --ref-local-fg: #bfdbfe;
      --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
      --d1-bg: #1f3a5f; --d1-fg: #bfdbfe; --d2-bg: #0b3d2e; --d2-fg: #86efac; --d3-bg: #2e1f5e; --d3-fg: #ddd6fe;
      --d4-bg: #3f2a06; --d4-fg: #fde68a; --d5-bg: #4a1d1d; --d5-fg: #fecaca; --d6-bg: #2c3239; --d6-fg: #c5cbd3;
    }
  }
  :root[data-theme="dark"] {
    --surface: #182029; --surface-alt: #10161e; --sunken: #141b23;
    --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
    --border: #2a3340; --border-soft: #222a35;
    --primary: #3b7bff; --on-primary: #0b1220; --primary-soft: rgba(59, 123, 255, 0.16);
    --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #93c5fd;
    --page: #0c1117; --scrim: rgba(0, 0, 0, 0.5); --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    --ref-local-bg: #1f3a5f; --ref-local-fg: #bfdbfe;
    --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    --d1-bg: #1f3a5f; --d1-fg: #bfdbfe; --d2-bg: #0b3d2e; --d2-fg: #86efac; --d3-bg: #2e1f5e; --d3-fg: #ddd6fe;
    --d4-bg: #3f2a06; --d4-fg: #fde68a; --d5-bg: #4a1d1d; --d5-fg: #fecaca; --d6-bg: #2c3239; --d6-fg: #c5cbd3;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Ubuntu", sans-serif; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  svg { display: block; }
  kbd { font-family: var(--mono); font-size: 10.5px; padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface); color: var(--meta); line-height: 15px; }

  /* ---------- page chrome ---------- */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 9px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
  .top .sub { color: var(--meta); font-size: 12px; }
  .right { display: flex; gap: 10px; margin-left: auto; align-items: center; }
  .switch { display: flex; gap: 4px; }
  .switch button, .theme button { border: 1px solid var(--border); background: var(--surface); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  .switch button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .switch button b { font-weight: 700; margin-right: 6px; }
  .theme { display: flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .theme button { border: 0; border-left: 1px solid var(--border); border-radius: 0; padding: 4px 9px; color: var(--meta); }
  .theme button:first-child { border-left: 0; }
  .theme button.on { color: var(--text); background: var(--surface-alt); }
  main { padding: 20px 20px 56px; }
  .lead { max-width: 80ch; margin: 0 auto 14px; color: var(--text-2); }
  .lead h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 6px; text-wrap: balance; }
  .lead p { margin: 0 0 6px; }
  .lead b { color: var(--text); font-weight: 600; }
  .lead .quote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--meta); font-style: italic; margin: 8px 0; }
  .notes { max-width: 1280px; margin: 18px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .notes h3 { font-size: 12px; font-weight: 600; color: var(--meta); margin: 0 0 6px; }
  .notes ul { margin: 0; padding: 0; list-style: none; color: var(--text-2); }
  .notes li { display: flex; gap: 9px; margin: 0 0 7px; }
  .notes li .mark { flex: none; margin-top: 1px; }
  .notes li b { color: var(--text); font-weight: 600; }
  .mark { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: 10.5px; font-weight: 700; line-height: 1; font-style: normal; }
  .mark.cost { background: var(--surface-alt); color: var(--meta); box-shadow: inset 0 0 0 1px var(--border); }
  @media (max-width: 900px) { .notes { grid-template-columns: 1fr; } }

  /* ---------- the window behind the surface ---------- */
  .win-wrap { overflow-x: auto; padding-bottom: 6px; }
  .win { width: 1280px; max-width: 100%; height: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 14px 40px rgba(16, 24, 39, 0.22); display: grid; grid-template-rows: 30px 1fr; position: relative; user-select: none; }
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--meta); }
  .titlebar .word { font-weight: 600; color: var(--text); }
  .titlebar .hair { width: 1px; height: 14px; background: var(--border); }
  .shell { display: grid; grid-template-columns: 48px 240px 1fr; min-height: 0; }
  .rail { border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 10px; }
  .rail i { width: 22px; height: 22px; border-radius: 5px; background: var(--surface-alt); display: block; }
  .rail i.on { background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
  .tree { border-right: 1px solid var(--border); padding: 10px 12px; }
  .bar { height: 10px; border-radius: 3px; background: var(--surface-alt); margin: 8px 0; }
  .grid { padding: 8px 12px; }
  .grid .bar { margin: 12px 0; }
  .scrim { position: absolute; left: 0; top: 30px; right: 0; bottom: 0; background: var(--scrim); }

  /* ---------- shared bits ---------- */
  .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; z-index: 4; }
  .search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--border); flex: none; }
  .search svg { width: 17px; height: 17px; fill: var(--meta); flex: none; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px; min-width: 0; }
  .search input::placeholder { color: var(--disabled); }
  .scroller { overflow: auto; flex: 1; min-height: 0; }
  .foot { display: flex; align-items: center; gap: 16px; height: 38px; padding: 0 16px; border-top: 1px solid var(--border); background: var(--sunken); font-size: 12.5px; color: var(--meta); flex: none; white-space: nowrap; }
  .foot .sp { flex: 1; }
  .foot .hint { display: inline-flex; gap: 5px; align-items: center; }
  .foot a, .link { color: var(--primary); cursor: pointer; text-decoration: none; font-weight: 500; background: none; border: 0; padding: 0; }
  .foot a:hover, .link:hover { text-decoration: underline; }
  .empty { padding: 30px 18px; color: var(--meta); }
  .empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 4px; font-size: 13.5px; }
  .ref { display: inline-flex; align-items: center; gap: 3px; padding: 0 7px; height: 18px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--ref-local-bg); color: var(--ref-local-fg); white-space: nowrap; max-width: 15ch; }
  .ref svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
  .ref span { overflow: hidden; text-overflow: ellipsis; }
  .hl { background: rgba(21, 83, 201, 0.16); border-radius: 2px; }
  :root[data-theme="dark"] .hl { background: rgba(59, 123, 255, 0.28); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hl { background: rgba(59, 123, 255, 0.28); } }
  .path { font-family: var(--mono); font-size: 12px; color: var(--meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; min-width: 0; }
  .path bdi { unicode-bidi: plaintext; }
  .path .shared { color: var(--disabled); }
  .path .tail { color: var(--text-2); }
  .when { font-size: 12px; color: var(--meta); white-space: nowrap; }
  .now-chip { font-size: 11px; font-weight: 600; color: var(--ok); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; height: 17px; display: inline-flex; align-items: center; opacity: .85; }
  .state { display: inline-flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--meta); white-space: nowrap; font-family: var(--mono); }
  .state .dirty { color: var(--warn); }
  .state .ahead { color: var(--ok); }
  .state .behind { color: var(--meta); }
  .state .clean { color: var(--disabled); }
  .star { width: 22px; height: 22px; border: 0; background: transparent; border-radius: 4px; display: grid; place-items: center; cursor: pointer; color: var(--disabled); flex: none; }
  .star svg { width: 15px; height: 15px; fill: currentColor; }
  .star.on { color: var(--warn); }
  .x { width: 22px; height: 22px; border: 0; background: transparent; border-radius: 4px; color: var(--meta); display: grid; place-items: center; cursor: pointer; visibility: hidden; flex: none; }
  .x:hover { background: var(--hover); color: var(--text); }
  .x svg { width: 14px; height: 14px; fill: currentColor; }
  .key { font-family: var(--mono); font-size: 11.5px; color: var(--disabled); text-align: center; }
  .grouphead { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 16px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--meta); background: var(--sunken); border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 1; }
  .grouphead .n { margin-left: auto; font-family: var(--mono); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--disabled); }

  /* ---------- A · the list ---------- */
  .A .panel { width: 900px; max-height: 620px; }
  .A .row { display: grid; grid-template-columns: 26px 168px 116px minmax(60px, 1fr) 74px 88px; align-items: center; column-gap: 12px; height: 38px; padding: 0 12px 0 10px; border-left: 2px solid transparent; cursor: default; }
  .A .row + .row { box-shadow: inset 0 1px 0 var(--border-soft); }
  .A .row:hover { background: var(--hover); }
  .A .row.cur { background: var(--sel-bg); border-left-color: var(--sel-border); }
  .A .row.cur .key { color: var(--primary); }
  .A .row > .ref { justify-self: start; }
  .A .row .name { font-size: 14.5px; min-width: 0; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .A .row:hover .x, .A .row.cur .x { visibility: visible; }
  .A .row:hover .key, .A .row.cur .key { visibility: hidden; }
  .A .keycell { position: relative; }
  .A .keycell .x { position: absolute; inset: 0; margin: auto; }

  /* ---------- B · the desk ---------- */
  .B .deskpane { grid-column: 3; display: grid; grid-template-columns: 330px 1fr; min-height: 0; background: var(--surface); }
  .B .side { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--sunken); }
  .B .side .search { height: 44px; padding: 0 12px; background: var(--surface); }
  .B .side .search input { font-size: 13.5px; }
  .B .side .grouphead { background: transparent; border-bottom: 0; padding: 0 12px; height: 26px; margin-top: 6px; }
  .B .srow { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 8px; padding: 7px 10px 7px 12px; border-left: 2px solid transparent; cursor: default; }
  .B .srow:hover { background: var(--hover); }
  .B .srow.cur { background: var(--surface); border-left-color: var(--sel-border); }
  .B .srow .nm { font-size: 13.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .B .srow .sub { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
  .B .srow .sub .b { font-size: 11.5px; color: var(--meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .B .srow .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .B .detail { min-height: 0; overflow: auto; padding: 26px 30px 0; display: flex; flex-direction: column; }
  .B .detail h2 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .B .detail .pathline { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; }
  .B .detail .pathline .path { font-size: 12.5px; direction: ltr; }
  .B .facts { display: flex; gap: 22px; margin: 18px 0 0; padding: 12px 0; border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
  .B .fact { display: flex; flex-direction: column; gap: 3px; }
  .B .fact .k { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--meta); }
  .B .fact .v { font-size: 15px; font-weight: 600; font-family: var(--mono); }
  .B .log { margin: 16px 0 0; }
  .B .log h3 { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--meta); margin: 0 0 8px; font-weight: 600; }
  .B .commit { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; column-gap: 12px; height: 26px; }
  .B .commit .lane { position: relative; height: 26px; width: 16px; }
  .B .commit .lane::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--d1-fg); opacity: .35; }
  .B .commit:first-child .lane::before { top: 13px; }
  .B .commit:last-child .lane::before { bottom: 13px; }
  .B .commit .lane::after { content: ""; position: absolute; left: 4px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--d1-fg); }
  .B .commit .subj { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .B .commit .ago { font-size: 11.5px; color: var(--disabled); font-family: var(--mono); }
  .B .actions { margin-top: auto; padding: 16px 0 20px; border-top: 1px solid var(--border-soft); display: flex; align-items: center; gap: 10px; }
  .B .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .B .btn svg { width: 15px; height: 15px; fill: currentColor; }
  .B .btn:hover { background: var(--hover); }
  .B .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
  .B .btn.primary:hover { filter: brightness(1.08); }
  .B .btn.ghost { border-color: transparent; color: var(--meta); }
  .B .empty-detail { margin: auto; text-align: center; color: var(--meta); }

  /* ---------- C · the board ---------- */
  .C .panel { width: 1120px; max-height: 720px; }
  .C .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-soft); }
  .C .grouphead { grid-column: 1 / -1; }
  .C .card { background: var(--surface); position: relative; display: grid; grid-template-columns: 4px 1fr auto; column-gap: 14px; align-items: start; padding: 13px 14px 13px 0; min-height: 104px; cursor: default; }
  .C .card:hover { background: var(--hover); }
  .C .card.cur { background: var(--sel-bg); }
  .C .card .spine { grid-row: 1 / span 3; grid-column: 1; width: 4px; height: 100%; border-radius: 0 2px 2px 0; opacity: .85; }
  .C .card .line1 { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .C .card .nm { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .C .card .rt { grid-row: 1 / span 3; grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  .C .card .toprow { display: flex; align-items: center; gap: 4px; }
  .C .card .last { grid-column: 2; grid-row: 2; display: flex; align-items: baseline; gap: 8px; margin-top: 8px; min-width: 0; }
  .C .card .last .subj { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .C .card .last .ago { font-size: 11.5px; color: var(--disabled); white-space: nowrap; font-family: var(--mono); }
  .C .card .path { grid-column: 2; grid-row: 3; margin-top: 6px; }
  .C .spark { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
  .C .spark i { width: 4px; opacity: .5; border-radius: 1px; display: block; }
    .C .card:hover .x, .C .card.cur .x { visibility: visible; }
  
  /* ---------- N · today, for comparison ---------- */
  .N .panel { width: 1120px; max-height: 720px; }
  .N .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-soft); align-content: start; }
  .N .tile { background: var(--surface); display: grid; grid-template-columns: 36px 1fr auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 3px; min-height: 96px; padding: 14px 16px; border-left: 2px solid transparent; position: relative; cursor: default; }
  .N .tile:hover { background: var(--hover); }
  .N .tile.cur { background: var(--sel-bg); border-left-color: var(--sel-border); }
  .N .tile .disc { grid-row: 1 / span 2; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 2px; }
  .N .tile .nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; font-weight: 500; }
  .N .tile .nm span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .N .tile .key { grid-column: 3; }
  .N .tile .path { grid-column: 2 / span 2; }
  .N .tile .x { position: absolute; top: 8px; right: 8px; }
  .N .tile:hover .x, .N .tile.cur .x { visibility: visible; }
  .N .tile:hover .key, .N .tile.cur .key { visibility: hidden; }
  .p1 { background: var(--d1-bg); color: var(--d1-fg); } .p2 { background: var(--d2-bg); color: var(--d2-fg); } .p3 { background: var(--d3-bg); color: var(--d3-fg); }
  .p4 { background: var(--d4-bg); color: var(--d4-fg); } .p5 { background: var(--d5-bg); color: var(--d5-fg); } .p6 { background: var(--d6-bg); color: var(--d6-fg); }
  .s1 { background: var(--d1-fg); } .s2 { background: var(--d2-fg); } .s3 { background: var(--d3-fg); }
  .s4 { background: var(--d4-fg); } .s5 { background: var(--d5-fg); } .s6 { background: var(--d6-fg); }

  /* ---------- narrow screens (the link opened on a phone) ---------- */
  @media (max-width: 900px) {
    .top { gap: 8px 10px; padding: 8px 12px; }
    .right { margin-left: 0; flex-wrap: wrap; }
    .switch { flex-wrap: wrap; }
    main { padding: 14px 12px 40px; }
    .win { height: auto; min-height: 620px; }
    .shell { grid-template-columns: 1fr; }
    .rail, .tree, .grid { display: none; }
    .scrim { display: none; }
    .panel { position: static; transform: none; width: auto !important; max-width: none; max-height: none; border: 0; border-radius: 0; box-shadow: none; height: 100%; }
    .A .row { display: flex; align-items: center; gap: 8px; padding: 0 10px; }
    .A .row .name { flex: 1; }
    .A .row .path { display: none; }
    .A .keycell { width: 20px; }
    .C .cards, .N .tiles { grid-template-columns: 1fr; }

/** The prefix every listed root shares, cut at a separator (recentsModel.sharedRoot). */
function sharedRoot(roots) {
  if (roots.length < 2) return ''
  let p = roots[0]
  for (const r of roots.slice(1)) {
    let i = 0
    while (i < p.length && i < r.length && p[i].toLowerCase() === r[i].toLowerCase()) i++
    p = p.slice(0, i)
  }
  const cut = p.lastIndexOf('\\')
  return cut > 0 ? p.slice(0, cut + 1) : ''
}

function mark(text, q) {
  if (!q) return esc(text)
  const i = text.toLowerCase().indexOf(q.toLowerCase())
  if (i < 0) return esc(text)
  return esc(text.slice(0, i)) + '<mark class="hl">' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length))
}

function pathHtml(root, shared, q) {
  const rest = root.slice(shared.length)
  const cut = rest.lastIndexOf('\\')
  const mid = cut > 0 ? rest.slice(0, cut + 1) : ''
  const tail = cut > 0 ? rest.slice(cut + 1) : rest
  return `<bdi><span class="shared">${mark(shared, q)}</span>${mark(mid, q)}<span class="tail">${mark(tail, q)}</span></bdi>`
}

function branchChip(b, q) {
  return `<span class="ref">${svg(ICON.branch)}<span>${mark(b, q)}</span></span>`
}

function stateHtml(r) {
  if (r.dirty === 0 && r.ahead === 0 && r.behind === 0) return `<span class="state"><span class="clean">clean</span></span>`

  if (r.dirty) bits.push(`<span class="dirty" title="${r.dirty} changed files">●&nbsp;${r.dirty}</span>`)
  if (r.ahead) bits.push(`<span class="ahead" title="${r.ahead} to push">↑${r.ahead}</span>`)
  if (r.behind) bits.push(`<span class="behind" title="${r.behind} to pull">↓${r.behind}</span>`)
  return `<span class="state">${bits.join('')}</span>`
}

function visible() {
  const q = state.q.trim().toLowerCase()
  const items = state.items.filter((r) => r.root !== state.gone)
  if (!q) return items
  return items.filter((r) => (r.name + ' ' + r.root + ' ' + r.branch).toLowerCase().includes(q))
}

function grouped(list) {
  const pinned = list.filter((r) => r.pinned)

  }

  return out
}

      ['Room for the verbs', 'Open, Terminal here, Copy path, Remove — where you already are, not behind a context menu.'],
    ]],
    ['cost', [
      ['The biggest of the three', 'a new pane, a route for it, the empty state rewired, and the rail button changes meaning. Two or three days.'],
      ['Needs a read-only peek at an unopened repository', 'git log -5 and a status per selection — cheap, but it is the first time we touch a repository the engine has not opened. A session per hover would be wrong; one lazy read on selection is right.'],
      ['Decide', 'does the picker still exist as a dialog for “switch while I work”, or is the pane the only way in? Two entry points is the honest answer, and it costs a little more.'],
    ]],
  ],
  C: [
    ['what', [
      ['Two columns, not three', 'a card gets ~540 px and can carry a sentence of prose (the last commit) without truncating it to nothing.'],
      ['The disc becomes a spine', 'the same hashed colour, 4 px down the left edge; recognition without the noise of ten coloured circles.'],
      ['Activity bars', 'two weeks of commits, seven bars — a repository you left in the middle looks different from one you finished.'],
      ['Groups and pins', 'as in A and B.'],
    ]],
    ['cost', [
      ['Smallest change of the three', 'RecentTile grows a line and loses the disc; the grid goes to two columns. A day.'],
      ['Same engine work as A', 'lastOpened, plus a cached status/last-commit peek. The bars need git log --since=14.days --format=%cd per repository — the most expensive of the extras; drop them if the peek turns out slow.'],
      ['Risk', 'it is still a wall of cards. If the wall is what you dislike, C will not fix it — A or B will.'],
    ]],
  ],
  N: [
    ['what', [
      ['1120 × 720, centred, over a scrim', 'sized to your ask in v0.18.9 — “larger so that we can actually read the stuff on the cards”.'],
      ['Three tiles to a row, 96 px each', 'disc, name, branch chip, path; the cross on hover, 1–9 in the corner.'],
      ['Filter, arrows, Enter, Delete + Undo', 'all of which the three proposals keep.'],
    ]],
    ['cost', [
      ['What I think is wrong with it', 'the tiles are interchangeable — the only thing that differs is the path, set right-to-left; the discs are decorative; there is no time, no state, no sense of what you were doing there; and at ten entries the window is mostly empty.'],
      ['What is worth keeping', 'the size and the centring, the filter-first behaviour, the digits, and Delete with Undo.'],
    ]],
  ],
}

/* ---------------- render ---------------- */
function render() {
  document.body.className = state.v
  $('variants').innerHTML = Object.entries(VARIANTS)
    .map(([k, t]) => `<button data-variant="${k}" class="${k === state.v ? 'on' : ''}"><b>${k === 'N' ? '•' : k}</b>${t}</button>`)
    .join('')
  $('lead').innerHTML = LEAD[state.v]
  const list = visible()
  if (state.cur >= list.length) state.cur = Math.max(0, list.length - 1)
  const shared = sharedRoot(list.map((r) => r.root))
  const view = { A: viewA, B: viewB, C: viewC, N: viewN }[state.v]
  $('win').innerHTML = windowHtml(view(list, shared), state.v !== 'B')
  $('notes').innerHTML = NOTES[state.v]
    .map(([kind, rows]) => `<div><h3>${kind === 'what' ? 'What changes' : 'What it costs'}</h3><ul>${rows
      .map(([b, t], i) => `<li><i class="mark ${kind === 'cost' ? 'cost' : ''}">${kind === 'cost' ? '·' : i + 1}</i><span><b>${b}</b> — ${t}</span></li>`)
      .join('')}</ul></div>`)
    .join('')
  const input = $('win').querySelector('input')
  if (input) {
    input.focus()
    input.setSelectionRange(input.value.length, input.value.length)
  }
  const cur = $('win').querySelector('.cur')
  if (cur) cur.scrollIntoView({ block: 'nearest' })
}

function toast(msg) {
  state.toast = msg
  render()
  clearTimeout(toast.t)
  toast.t = setTimeout(() => {
    state.toast = ''
    render()
  }, 1400)
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-variant],[data-t],[data-forget],[data-pin],[data-act],[data-i]')
  if (!t) return
  if (t.dataset.variant) {
    state.v = t.dataset.variant
    state.q = ''
    state.cur = 0
    return render()
  }
  if (t.dataset.t) {
    document.documentElement.dataset.theme = t.dataset.t === 'auto' ? '' : t.dataset.t
    if (t.dataset.t === 'auto') delete document.documentElement.dataset.theme
    for (const b of $('theme').children) b.classList.toggle('on', b === t)
    return
  }
  if (t.dataset.act === 'undo') {
    state.gone = null
    return render()
  }
  if (t.dataset.act === 'folder') return toast('Open folder…')
  if (t.dataset.pin) {
    const r = state.items.find((x) => x.root === t.dataset.pin)
    r.pinned = !r.pinned
    return render()
  }
  if (t.dataset.forget) {
    state.gone = t.dataset.forget
    return render()
  }
  if (t.dataset.i !== undefined) {
    state.cur = Number(t.dataset.i)
    return render()
  }
})

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey) return
  const list = visible()
  const cols = state.v === 'C' ? 2 : state.v === 'N' ? 3 : 1
  const move = (to) => {
    e.preventDefault()
    state.cur = Math.max(0, Math.min(list.length - 1, to))
    render()
  }
  switch (e.key) {
    case 'ArrowDown': return move(state.cur + cols)
    case 'ArrowUp': return move(state.cur - cols)
    case 'ArrowRight': return cols > 1 ? move(state.cur + 1) : undefined
    case 'ArrowLeft': return cols > 1 ? move(state.cur - 1) : undefined
    case 'Enter':
      e.preventDefault()
      return list[state.cur] ? toast(`Opened ${list[state.cur].name}`) : undefined
    case 'Escape':
      e.preventDefault()
      if (state.q) {
        state.q = ''
        state.cur = 0
        return render()
      }
      return toast('Closed')
    case 'Delete':
      if (!state.q && list[state.cur]) {
        state.gone = list[state.cur].root
        return render()
      }
      return
    default:
      if (/^[1-9]$/.test(e.key) && !state.q) {
        e.preventDefault()
        return list[Number(e.key) - 1] ? toast(`Opened ${list[Number(e.key) - 1].name}`) : undefined
      }
  }
})

document.addEventListener('input', (e) => {
  if (e.target.tagName !== 'INPUT') return
  state.q = e.target.value
  state.cur = 0
  render()
})

render()
</script>
