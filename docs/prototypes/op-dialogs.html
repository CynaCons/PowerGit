<title>PowerGit Operation Dialogs</title>
<style>
  :root {
    --surface: #ffffff; --surface-alt: #eef1f5; --sunken: #f6f8fb;
    --text: #101827; --text-2: #334155; --meta: #5b6778; --disabled: #64748b;
    --border: #d6dce5; --border-soft: #e6eaf0;
    --primary: #1553c9; --on-primary: #fff; --primary-soft: rgba(21, 83, 201, 0.10);
    --sel-bg: #dbeafe; --sel-border: #2563eb; --hover: rgba(37, 99, 235, 0.08); --focus: #2563eb;
    --page: #e3e7ee; --scrim: rgba(16, 24, 39, 0.28); --shadow: 0 18px 48px rgba(16, 24, 39, 0.26); --menu-shadow: 0 6px 24px rgba(16, 24, 39, 0.18);
    /* Git Extensions lane set, theme/tokens.ts */
    --lane1: #f064a0; --lane2: #78b4e6; --lane3: #24c221; --lane4: #a078f0; --lane5: #dd3228; --lane6: #1ac6a6; --lane7: #e7b00f; --head-outline: #1a1a1a;
    /* the ref badge pairs */
    --ref-local-bg: #eff6ff; --ref-local-fg: #2563eb; --ref-remote-bg: #ecfdf5; --ref-remote-fg: #059669;
    --ref-tag-bg: #f5f3ff; --ref-tag-fg: #6d28d9; --ref-head-bg: #fef2f2; --ref-head-fg: #dc2626;
    /* destructive primaries: the head-ref pair; the "uncommitted changes" note: the review todo amber */
    --danger-fg: #b91c1c; --danger-bg: #fef2f2; --amber: #b7791f;
    --mono: "Fira Code", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #182029; --surface-alt: #10161e; --sunken: #141b23;
      --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
      --border: #2a3340; --border-soft: #222a35;
      --primary: #3b7bff; --on-primary: #0b1220; --primary-soft: rgba(59, 123, 255, 0.16);
      --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #93c5fd;
      --page: #0c1117; --scrim: rgba(0, 0, 0, 0.5); --shadow: 0 18px 48px rgba(0, 0, 0, 0.55); --menu-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      --lane1: #f47db1; --lane2: #82bdf0; --lane3: #3ad636; --lane4: #b08cf7; --lane5: #f0655a; --lane6: #2bd4b4; --lane7: #f0be2a; --head-outline: #f1f3f6;
      --ref-local-bg: #1f3a5f; --ref-local-fg: #bfdbfe; --ref-remote-bg: #0b3d2e; --ref-remote-fg: #86efac;
      --ref-tag-bg: #2e1f5e; --ref-tag-fg: #ddd6fe; --ref-head-bg: #4a1d1d; --ref-head-fg: #fecaca;
      --danger-fg: #fca5a5; --danger-bg: #4a1d1d; --amber: #e0a83a;
    }
  }
  :root[data-theme="dark"], .force-dark {
    --surface: #182029; --surface-alt: #10161e; --sunken: #141b23;
    --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
    --border: #2a3340; --border-soft: #222a35;
    --primary: #3b7bff; --on-primary: #0b1220; --primary-soft: rgba(59, 123, 255, 0.16);
    --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #93c5fd;
    --page: #0c1117; --scrim: rgba(0, 0, 0, 0.5); --shadow: 0 18px 48px rgba(0, 0, 0, 0.55); --menu-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    --lane1: #f47db1; --lane2: #82bdf0; --lane3: #3ad636; --lane4: #b08cf7; --lane5: #f0655a; --lane6: #2bd4b4; --lane7: #f0be2a; --head-outline: #f1f3f6;
    --ref-local-bg: #1f3a5f; --ref-local-fg: #bfdbfe; --ref-remote-bg: #0b3d2e; --ref-remote-fg: #86efac;
    --ref-tag-bg: #2e1f5e; --ref-tag-fg: #ddd6fe; --ref-head-bg: #4a1d1d; --ref-head-fg: #fecaca;
    --danger-fg: #fca5a5; --danger-bg: #4a1d1d; --amber: #e0a83a;
  }
  .force-light {
    --surface: #ffffff; --surface-alt: #eef1f5; --sunken: #f6f8fb; --text: #101827; --text-2: #334155; --meta: #5b6778; --disabled: #64748b;
    --border: #d6dce5; --border-soft: #e6eaf0; --primary: #1553c9; --on-primary: #fff; --primary-soft: rgba(21, 83, 201, 0.10);
    --sel-bg: #dbeafe; --sel-border: #2563eb; --hover: rgba(37, 99, 235, 0.08); --focus: #2563eb; --page: #e3e7ee; --shadow: 0 18px 48px rgba(16, 24, 39, 0.26);
    --lane3: #24c221; --lane4: #a078f0; --lane5: #dd3228; --head-outline: #1a1a1a;
    --ref-local-bg: #eff6ff; --ref-local-fg: #2563eb; --ref-remote-bg: #ecfdf5; --ref-remote-fg: #059669; --ref-tag-bg: #f5f3ff; --ref-tag-fg: #6d28d9; --ref-head-bg: #fef2f2; --ref-head-fg: #dc2626;
    --danger-fg: #b91c1c; --danger-bg: #fef2f2; --amber: #b7791f;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Ubuntu", sans-serif; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  svg { display: block; }
  kbd { font: inherit; font-size: 10.5px; font-family: var(--mono); padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface); color: var(--meta); line-height: 15px; }
  code { font-family: var(--mono); font-size: 12px; }

  /* ---------- page chrome ---------- */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 9px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top h1 { font-size: 14px; font-weight: 600; margin: 0; white-space: nowrap; }
  .top .sub { color: var(--meta); font-size: 12px; }
  .tabs { display: flex; gap: 2px; border: 1px solid var(--border); border-radius: 6px; padding: 2px; background: var(--surface-alt); }
  .tabs button { border: 0; background: transparent; border-radius: 4px; padding: 4px 10px; cursor: pointer; color: var(--text-2); display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tabs button .n { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font-size: 11px; font-weight: 600; background: var(--surface); color: var(--meta); border: 1px solid var(--border); }
  .tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(16, 24, 39, 0.12); }
  .tabs button.on .n { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .right { display: flex; gap: 10px; margin-left: auto; align-items: center; }
  .switch { display: flex; gap: 4px; }
  .switch button, .theme button { border: 1px solid var(--border); background: var(--surface); border-radius: 5px; padding: 4px 10px; cursor: pointer; }
  .switch button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .switch button b { font-weight: 700; margin-right: 6px; }
  .theme { display: flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .theme button { border: 0; border-left: 1px solid var(--border); border-radius: 0; padding: 4px 9px; color: var(--meta); }
  .theme button:first-child { border-left: 0; }
  .theme button.on { color: var(--text); background: var(--surface-alt); }
  main { padding: 20px 20px 56px; }
  .lead { max-width: 78ch; margin: 0 auto 14px; color: var(--text-2); }
  .lead h2 { font-size: 15px; font-weight: 600; color: var(--text); margin: 0 0 6px; text-wrap: balance; }
  .lead p { margin: 0 0 6px; }
  .lead b { color: var(--text); font-weight: 600; }
  .lead .quote { border-left: 2px solid var(--border); padding-left: 10px; color: var(--meta); font-style: italic; margin: 8px 0; }
  .sub-switch { display: flex; gap: 4px; align-items: center; margin: 8px 0 0; font-size: 12px; color: var(--meta); }
  .sub-switch button { border: 1px solid var(--border); background: var(--surface); border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 12px; }
  .sub-switch button.on { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .notes { max-width: 1180px; margin: 16px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .notes h3 { font-size: 12px; font-weight: 600; color: var(--meta); margin: 0 0 6px; }
  .notes ol, .notes ul { margin: 0; padding: 0; list-style: none; color: var(--text-2); }
  .notes li { display: flex; gap: 9px; margin: 0 0 7px; }
  .notes li .mark { flex: none; margin-top: 1px; }
  .notes li b { color: var(--text); font-weight: 600; }
  .mark { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); color: var(--on-primary); font-size: 10.5px; font-weight: 700; line-height: 1; font-style: normal; }
  .rule { max-width: 1180px; margin: 18px auto 0; padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 12.5px; color: var(--text-2); }
  .rule b { color: var(--text); }
  @media (max-width: 800px) { .notes { grid-template-columns: 1fr; } }

  /* ---------- the window behind the dialog (1280 × 760 stage) ---------- */
  .win-wrap { overflow-x: auto; }
  .win { width: 1280px; max-width: 100%; height: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 14px 40px rgba(16, 24, 39, 0.22); display: grid; grid-template-rows: 30px 1fr 22px; position: relative; user-select: none; }
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--meta); }
  .titlebar .word { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .titlebar .word i { width: 12px; height: 12px; background: var(--primary); display: inline-block; clip-path: polygon(0 0, 40% 0, 100% 100%, 60% 100%); }
  .titlebar .hair { width: 1px; height: 14px; background: var(--border); }
  .titlebar .wc { margin-left: auto; display: flex; gap: 18px; color: var(--meta); font-size: 11px; }
  .shell { display: grid; grid-template-columns: 188px 240px 1fr; min-height: 0; }
  .status { display: flex; align-items: center; gap: 12px; padding: 0 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--meta); }
  .status .br { color: var(--primary); font-weight: 500; }
  .status .sp { flex: 1; }
  /* the command rail, expanded */
  .rail { border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 6px 0; font-size: 12.5px; min-height: 0; }
  .ri { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 14px; color: var(--text); white-space: nowrap; }
  .ri svg { width: 17px; height: 17px; fill: currentColor; color: var(--meta); flex: none; }
  .ri .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .ri .chev { width: 14px; height: 14px; color: var(--meta); }
  .ri .cnt { display: inline-grid; place-items: center; min-width: 17px; height: 17px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 10.5px; font-weight: 700; padding: 0 5px; }
  .ri.gap { margin-top: 8px; }
  .ri.commit svg { color: var(--on-primary); background: var(--primary); border-radius: 5px; padding: 2px; width: 20px; height: 20px; }
  .rail .grow { flex: 1; }
  /* the Repository panel */
  .left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; font-size: 12.5px; }
  .left .head { display: flex; align-items: center; height: 38px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; gap: 6px; }
  .left .head .sp { flex: 1; }
  .left .head svg { width: 16px; height: 16px; fill: currentColor; color: var(--meta); }
  .left .search { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-bottom: 1px solid var(--border); color: var(--disabled); background: var(--sunken); }
  .left .search svg { width: 14px; height: 14px; fill: currentColor; }
  .tree { flex: 1; overflow: hidden; padding-top: 2px; }
  .trow { display: flex; align-items: center; height: 22px; padding-right: 6px; white-space: nowrap; color: var(--text); }
  .trow.sec { color: var(--meta); font-weight: 500; }
  .trow.cur { background: var(--sel-bg); }
  .trow.cur .lbl, .trow.cur .ico { color: var(--primary); font-weight: 700; }
  .slot { width: 16px; flex: none; display: inline-grid; place-items: center; color: var(--meta); }
  .slot svg { width: 15px; height: 15px; fill: currentColor; }
  .ico { width: 16px; flex: none; display: inline-grid; place-items: center; margin-right: 4px; color: var(--meta); }
  .ico svg { width: 13px; height: 13px; fill: currentColor; }
  .trow .lbl { overflow: hidden; text-overflow: ellipsis; }
  /* the grid + the bottom panel */
  .rightp { display: grid; grid-template-rows: 1fr 6px 150px; min-height: 0; min-width: 0; }
  .grid { display: grid; grid-template-rows: 28px 1fr; min-height: 0; position: relative; }
  .ghead, .row { display: grid; grid-template-columns: 96px 1fr 154px 142px 86px; align-items: center; padding-right: 16px; }
  .ghead { font-size: 12px; font-weight: 500; color: var(--meta); border-bottom: 1px solid var(--border-soft); }
  .ghead > div { padding-left: 8px; height: 100%; display: flex; align-items: center; border-left: 1px solid var(--border-soft); }
  .ghead > div:first-child { border-left: 0; padding-left: 16px; }
  .gbody { overflow: hidden; position: relative; }
  .gsvg { position: absolute; top: 0; left: 2px; z-index: 1; pointer-events: none; }
  .row { height: 28px; border-left: 2px solid transparent; cursor: default; position: relative; }
  .row.tall { height: 48px; }
  .row > .cell { height: 100%; display: flex; align-items: center; min-width: 0; white-space: nowrap; }
  .row.selected { border-left-color: var(--sel-border); background: var(--sel-bg); }
  .msg { padding-left: 12px; gap: 6px; overflow: hidden; }
  .row.tall > .cell { height: 28px; align-self: start; }
  .row.tall .hint { position: absolute; left: 108px; bottom: 5px; }
  .msg .line { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
  .msg .hint { font-size: 11.5px; color: var(--meta); display: flex; gap: 5px; align-items: center; }
  .msg-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-text.wd { font-style: italic; color: var(--text-2); }
  .author, .date, .sha { color: var(--meta); font-size: 12px; padding-right: 10px; overflow: hidden; text-overflow: ellipsis; }
  .author { padding-left: 8px; gap: 7px; }
  .disc { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 9.5px; font-weight: 700; flex: none; background: var(--ref-local-bg); color: var(--ref-local-fg); }
  .date { padding-left: 8px; }
  .sha { font-family: var(--mono); font-size: 11px; justify-content: flex-end; padding-right: 8px; }
  .split { background: var(--page); }
  .bottom { border-top: 1px solid var(--border); padding: 0 16px; font-size: 12.5px; overflow: hidden; }
  .bottom .tabs2 { display: flex; gap: 18px; height: 34px; align-items: center; color: var(--meta); border-bottom: 1px solid var(--border-soft); margin-bottom: 8px; }
  .bottom .tabs2 b { color: var(--primary); font-weight: 500; box-shadow: inset 0 -2px 0 var(--primary); padding: 8px 0; }
  .bottom h4 { margin: 0 0 4px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom p { margin: 0 0 3px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scrim { position: absolute; left: 0; top: 30px; right: 0; bottom: 22px; background: var(--scrim); z-index: 4; }

  /* ref chips, as app.css draws them (+ the ghost and the invalid state, new here) */
  .ref { display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; height: 16px; border-radius: 999px; font-size: 10px; font-weight: 600; background: var(--ref-local-bg); color: var(--ref-local-fg); white-space: nowrap; max-width: 100%; }
  .ref svg { width: 11px; height: 11px; fill: currentColor; flex: none; }
  .ref.remote { background: var(--ref-remote-bg); color: var(--ref-remote-fg); }
  .ref.tag { background: var(--ref-tag-bg); color: var(--ref-tag-fg); }
  .ref.head { background: var(--ref-head-bg); color: var(--ref-head-fg); }
  .ref.big { height: 20px; font-size: 11px; padding: 0 8px; gap: 4px; }
  .ref.big svg { width: 12px; height: 12px; }
  .ref.ghost { background: transparent; border: 1px dashed var(--meta); color: var(--meta); }
  .ref.bad { background: var(--ref-head-bg); color: var(--ref-head-fg); }
  .ref .in { border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-weight: 600; padding: 0; min-width: 8px; width: 8px; }
  .ref.live { padding-right: 8px; }
  .why { font-size: 12px; color: var(--ref-head-fg); }

  /* ---------- the dialog shell ---------- */
  .dlg { width: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); display: flex; flex-direction: column; font-size: 13px; color: var(--text); text-align: left; position: relative; }
  .dlg.w560 { width: 560px; }
  .dlg.w600 { width: 600px; }
  .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); z-index: 6; }
  .hd { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; }
  .hd h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; white-space: nowrap; }
  .hd .keys { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; color: var(--meta); }
  .quote { background: var(--sunken); border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); padding: 2px 16px; }
  .qrow { display: flex; align-items: center; gap: 8px; height: 30px; min-width: 0; }
  .qrow .node { width: 12px; height: 12px; flex: none; display: grid; place-items: center; }
  .qrow .qsha { font-family: var(--mono); font-size: 12px; color: var(--text-2); flex: none; }
  .qrow .refs { display: inline-flex; gap: 4px; flex: none; max-width: 46%; overflow: hidden; }
  .qrow .subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow .when { font-size: 12px; color: var(--meta); flex: none; }
  .qrow .disc { width: 16px; height: 16px; font-size: 8.5px; }
  .quote .into { display: flex; align-items: center; gap: 6px; height: 16px; font-size: 11px; color: var(--meta); padding-left: 1px; margin: -3px 0; }
  .quote .into svg { width: 12px; height: 12px; fill: currentColor; }
  .body { padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; position: relative; }
  .lab { display: flex; align-items: center; gap: 8px; font-weight: 500; min-height: 20px; }
  .lab .as { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--meta); font-weight: 400; min-width: 0; }
  .lab .cap { font-size: 12px; color: var(--meta); font-weight: 400; }
  .field input[type="text"], .field textarea { height: 34px; border: 1px solid var(--border); border-radius: 5px; padding: 0 10px; font: inherit; background: var(--surface); color: var(--text); width: 100%; }
  .field textarea { height: 56px; padding: 7px 10px; resize: vertical; font-family: inherit; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
  .field input::placeholder { color: var(--disabled); }
  .grp { font-weight: 500; margin-bottom: -4px; }
  .opt { display: flex; align-items: center; gap: 8px; min-height: 22px; cursor: default; }
  .opt input { width: 14px; height: 14px; margin: 0; accent-color: var(--primary); flex: none; }
  .opt .ex { color: var(--meta); font-size: 12px; }
  .opt .ex::before { content: "— "; }
  .opt.off { color: var(--disabled); }
  .opt .inl { height: 26px; border: 1px solid var(--border); border-radius: 4px; padding: 0 8px; font: inherit; background: var(--surface); color: var(--text); width: 150px; }
  .opt .inl:focus { outline: 2px solid var(--focus); outline-offset: -1px; }
  .note { font-size: 12px; color: var(--meta); padding-left: 22px; margin-top: -6px; }
  .note.amber, .ft .note.amber { color: var(--amber); }
  .ft { display: flex; align-items: center; gap: 8px; padding: 10px 16px 12px; border-top: 1px solid var(--border-soft); }
  .ft .note { flex: 1; min-width: 0; padding: 0; margin: 0; }
  .btn { height: 30px; padding: 0 14px; border-radius: 5px; border: 1px solid transparent; background: transparent; color: var(--primary); font-weight: 500; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--primary); color: var(--on-primary); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled { opacity: 0.45; cursor: default; filter: none; }
  .btn.danger { background: var(--danger-bg); color: var(--danger-fg); border-color: var(--danger-fg); font-weight: 600; }
  /* the branch picker: label above, the value is the chip, a searchable list when open */

    a = li(1, `<b>The picker</b> is one component for Checkout and Merge: label above, value = chip + the tip's SHA and subject, a searchable list with the checked-out branch excluded, remotes under their own heading with the cloud glyph, every option one line.`) + li(2, `<b>Check it out as</b> maps to GE's three radios; the local branch name is an inline field inside the first option, validated like Create branch. When resetting would leave commits unreachable the note is amber and the primary red; when the local branch is simply behind, the reset is a fast-forward and the button stays blue (rule proposed, see the question).`) + li(3, `<b>Local changes</b> replaces the "Force" checkbox: keep (git carries them if they do not conflict), stash (autostash), discard (reset first) — the last makes the primary red.`);
    b = bl(`<b>Engine:</b> <code>checkout</code> takes <code>{ ref, as: "create" | "reset" | "detach", localName, track, localChanges: "keep" | "stash" | "discard" }</code>; the ahead/behind count between the local and the remote comes from <code>rev-list --left-right --count</code>, one call when the dialog opens.`) + bl(`<b>Cost:</b> a day and a half: the picker (shared with Merge), the dialog, the engine route, an e2e for each of the three cases.`) + bl(`<b>Question for the owner:</b> when the local branch exists, GE selects "Reset" by default. Here it is the default too, with the red button — or should "Create" stay the default with a suggested name (<code>wt/v18-picker-2</code>) so that Enter never discards?`);
  } else {
    a = li(1, `<b>Reset:</b> the band says "powergit moves from 3363352 to 4c62660"; each mode carries its consequence after the dash; Hard makes the primary red and puts the count in it.`) + li(2, `<b>Delete:</b> the chip and its tip row; merged → a quiet note and a blue button; unmerged → the count of commits that become unreachable and a red "Delete unmerged branch".`) + li(3, `<b>Merge:</b> the two tips with "into" between them; the picker is the only field; fast-forward as a labelled radio group; the amber note about the uncommitted change goes away when Auto stash is ticked; Squash renames the button.`) + li(4, `<b>Create tag:</b> the same as Create branch with a violet tag chip and a message field whose caption says what a message does.`);
    b = bl(`<b>One shell, five dialogs:</b> <code>OpDialog({ title, subject, width, note, primary: { label, danger, disabled } })</code>; Rebase, Cherry-pick and Revert follow with a single quoted row and no inputs (Rebase keeps its four checkboxes).`) + bl(`<b>Cost for the family:</b> two days after the shell exists — mostly moving copy and the engine's counts (ahead/behind, merged-into, dirty count) into the props; visual baselines for each.`);
  }
  $('rule').innerHTML = `<b>Rule for the whole family:</b> no label, option or field is ever clipped or wrapped — labels sit above fields, the dialog takes the width of its longest line (520–640), option explanations go after an em dash on the same line or on a 12 px meta line under it, never inside the control.`;
  $('notes').innerHTML = `<div><h3>What you are looking at</h3><ol>${a}</ol></div><div><h3>How it would be built</h3><ul>${b}</ul></div>`;
}

/* ---------- interactions ---------- */
let toastTimer = null;
function toast(t) { const el = $('toast'); if (!el) return; el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1800); }
function go() { const t = state.tab; if (t === 1) toast(refError(state.name, LOCAL) ? 'The name is not valid yet' : `Creating ${state.name || 'the branch'} at 4c62660${state.checkout ? ' and checking it out' : ''}…`); else if (t === 2) toast('Checking out…'); }
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-variant],[data-t],[data-co],[data-act],[data-open],[data-pick]');
  if (!t) { if (state.pick && !e.target.closest('.menu')) { state.pick = null; state.filter = ''; renderStage(); } return; }
  if (t.dataset.tab) { state.tab = +t.dataset.tab; state.pick = null; return render(); }
  if (t.dataset.variant) { state.variant = t.dataset.variant; return render(); }
  if (t.dataset.t) { const v = t.dataset.t; document.documentElement.removeAttribute('data-theme'); if (v !== 'system') document.documentElement.setAttribute('data-theme', v); document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === v)); if (state.tab === 3) renderStage(); return; }
  if (t.dataset.co) { state.co = t.dataset.co; state.coMode = state.co === 'remote-local' ? 'reset' : 'create'; state.pick = null; return render(); }
  if (t.dataset.open) { state.pick = state.pick === t.dataset.open ? null : t.dataset.open; state.filter = ''; return renderStage(); }
  if (t.dataset.pick) { if (state.pick === 'merge' || state.tab === 3) state.merge = TIP[t.dataset.pick] ? t.dataset.pick : state.merge; state.pick = null; state.filter = ''; toast(`Picked ${t.dataset.pick}`); return renderStage(); }
  if (t.dataset.act === 'cancel') return toast('Closes the dialog');
  if (t.dataset.act === 'go') return go();
  if (t.dataset.act === 'del-toggle') { state.delMerged = !state.delMerged; return renderStage(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'bn') { state.name = el.value; const c = el.selectionStart; renderStage(); const n = $('bn'); if (n) n.setSelectionRange(c, c); }
  else if (el.id === 'tn') { state.tag = el.value; const c = el.selectionStart; renderStage(); const n = $('tn'); if (n) { n.focus(); n.setSelectionRange(c, c); } }
  else if (el.id === 'tm') { state.tagMsg = el.value; const c = el.selectionStart; renderStage(); const n = $('tm'); if (n) { n.focus(); n.setSelectionRange(c, c); } }
  else if (el.id === 'coName') { state.coName = el.value; const c = el.selectionStart; renderStage(); const n = $('coName'); if (n) { n.focus(); n.setSelectionRange(c, c); } }
  else if (el.id === 'mf') { state.filter = el.value; const c = el.selectionStart; renderStage(); const n = $('mf'); if (n) { n.focus(); n.setSelectionRange(c, c); } }
});
document.addEventListener('change', (e) => {
  const el = e.target; if (el.tagName !== 'INPUT' || (el.type !== 'radio' && el.type !== 'checkbox')) return;
  const n = el.name, v = el.value, on = el.checked;
  if (n === 'co') state.checkout = on; else if (n === 'orphan') state.orphan = on; else if (n === 'mode') state.coMode = v; else if (n === 'lc') state.coLocal = v;
  else if (n === 'ff') state.ff = v; else if (n === 'squash') state.squash = on; else if (n === 'autostash') state.autostash = on; else if (n === 'mmsg') state.mergeMsg = on; else if (n === 'rs') state.reset = v;
  state.noFocus = true; renderStage(); state.noFocus = false;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (state.pick) { state.pick = null; state.filter = ''; renderStage(); } else toast('Cancels'); }
  else if (e.key === 'Enter' && (e.target.id === 'bn' || e.target.id === 'coName' || e.target.classList.contains('opt'))) { e.preventDefault(); go(); }
});
/* the C chip sizes itself to its text */
new MutationObserver(() => { const i = document.querySelector('.ref.live .in'); if (i) i.style.width = Math.max(8, i.value.length * 6.6 + 2) + 'px'; }).observe($('stage'), { childList: true, subtree: true });
document.addEventListener('input', (e) => { if (e.target.classList && e.target.classList.contains('in')) e.target.style.width = Math.max(8, e.target.value.length * 6.6 + 2) + 'px'; });
render();
</script>
