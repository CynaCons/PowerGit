<title>PowerGit Settings Layouts</title>
<style>
  :root {
    --surface: #ffffff; --surface-alt: #eef1f5; --sunken: #f6f8fb; --code-bg: #f8fafc;
    --text: #101827; --text-2: #334155; --meta: #5b6778; --disabled: #64748b;
    --border: #d6dce5; --border-soft: #e6eaf0;
    --primary: #1553c9; --primary-dark: #0f3f9c; --on-primary: #ffffff; --primary-soft: rgba(21, 83, 201, 0.10);
    --sel-bg: #dbeafe; --sel-border: #2563eb; --hover: rgba(37, 99, 235, 0.08); --focus: #2563eb;
    --warn: #b7791f; --ok: #059669; --err: #dc2626;
    --page: #e3e7ee; --shadow: 0 14px 40px rgba(16, 24, 39, 0.22); --scrim: rgba(16, 24, 39, 0.38);
    --lane1: #1553c9; --lane2: #059669; --lane3: #a16207;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #182029; --surface-alt: #10161e; --sunken: #141b23; --code-bg: #10161e;
      --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
      --border: #2a3340; --border-soft: #222a35;
      --primary: #3b7bff; --primary-dark: #2f66d6; --on-primary: #ffffff; --primary-soft: rgba(59, 123, 255, 0.16);
      --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #60a5fa;
      --warn: #e0a83a; --ok: #34d399; --err: #f87171;
      --page: #0c1117; --shadow: 0 14px 40px rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.5);
      --lane1: #60a5fa; --lane2: #34d399; --lane3: #e0a83a;
    }
  }
  :root[data-theme="dark"] {
    --surface: #182029; --surface-alt: #10161e; --sunken: #141b23; --code-bg: #10161e;
    --text: #e6e9ef; --text-2: #b6bcc6; --meta: #98a4b3; --disabled: #8b939f;
    --border: #2a3340; --border-soft: #222a35;
    --primary: #3b7bff; --primary-dark: #2f66d6; --on-primary: #ffffff; --primary-soft: rgba(59, 123, 255, 0.16);
    --sel-bg: #1f3a5f; --sel-border: #60a5fa; --hover: rgba(96, 165, 250, 0.12); --focus: #60a5fa;
    --warn: #e0a83a; --ok: #34d399; --err: #f87171;
    --page: #0c1117; --shadow: 0 14px 40px rgba(0, 0, 0, 0.5); --scrim: rgba(0, 0, 0, 0.5);
    --lane1: #60a5fa; --lane2: #34d399; --lane3: #e0a83a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    font-variant-numeric: tabular-nums;
  }
  code, .mono { font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", ui-monospace, monospace; font-size: 12px; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- page chrome ---------- */
  .top {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .top h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .top .sub { color: var(--meta); font-size: 12px; }
  .switch { display: flex; gap: 4px; margin-left: auto; }
  .switch button, .theme button {
    border: 1px solid var(--border); background: var(--surface); border-radius: 5px; padding: 5px 11px; cursor: pointer;
  }
  .switch button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .theme { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .theme button { border: 0; border-left: 1px solid var(--border); border-radius: 0; padding: 5px 9px; color: var(--meta); }
  .theme button:first-child { border-left: 0; }
  .theme button.on { color: var(--text); background: var(--surface-alt); }

  main { padding: 22px 20px 48px; }
  .lead { max-width: 74ch; margin: 0 auto 16px; color: var(--text-2); }
  .lead p { margin: 0 0 6px; }
  .lead b { color: var(--text); font-weight: 600; }

  /* ---------- the faux PowerGit window ---------- */
  .win {
    width: 1140px; max-width: 100%; height: 660px; margin: 0 auto; background: var(--surface-alt);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow);
    display: grid; grid-template-rows: 30px 1fr;
  }
  .titlebar {
    display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--meta);
  }
  .titlebar .dots { display: flex; gap: 6px; margin-left: auto; }
  .titlebar .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); display: block; }
  .winbody { display: grid; grid-template-columns: 44px 1fr; min-height: 0; }
  .rail { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 6px; }
  .rail .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--meta); }
  .rail .ico.on { background: var(--primary-soft); color: var(--primary); }
  .rail .spacer { flex: 1; }
  .content { position: relative; min-height: 0; overflow: hidden; }

  /* faux Browse view behind the dialogs */
  .browse { position: absolute; inset: 0; display: grid; grid-template-rows: 34px 1fr; }
  .browse .strip { display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border); color: var(--meta); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .browse .strip b { color: var(--primary); border-bottom: 2px solid var(--primary); padding: 8px 0; font-weight: 600; }
  .browse .rows { background: var(--surface); }
  .browse .row { display: grid; grid-template-columns: 60px 1fr 170px 110px; align-items: center; height: 26px; border-bottom: 1px solid var(--border-soft); padding: 0 8px; color: var(--text-2); }
  .browse .row .lane { position: relative; height: 100%; }
  .browse .row .lane::before { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: var(--lane1); }
  .browse .row .lane i { position: absolute; left: 8px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--lane1); border: 2px solid var(--surface); }
  .browse .row.b2 .lane::before, .browse .row.b2 .lane i { background: var(--lane2); left: 26px; }
  .browse .row.b2 .lane i { left: 22px; }
  .browse .row .meta { color: var(--meta); font-size: 12px; }
  .browse .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--sel-bg); color: var(--primary); margin-right: 6px; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; }

  /* ---------- shared controls (the app's MUI look, flattened) ---------- */
  .sel, .txt {
    height: 30px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text);
    padding: 0 8px; font: inherit; min-width: 220px;
  }
  .sel { appearance: none; -webkit-appearance: none; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--meta) 50%), linear-gradient(135deg, var(--meta) 50%, transparent 50%);
    background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px; background-size: 5px 5px; background-repeat: no-repeat; }
  .sel:hover, .txt:hover { border-color: var(--meta); }
  .txt.mono { font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", ui-monospace, monospace; font-size: 12px; }
  .txt::placeholder { color: var(--disabled); }
  .chk { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; }
  .chk input { margin: 2px 0 0; accent-color: var(--primary); width: 15px; height: 15px; flex: none; }
  .chk .t { font-weight: 500; }
  .chk .d { color: var(--meta); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 4px 10px; color: var(--text-2); cursor: pointer; border-left: 1px solid var(--border); font-size: 12.5px; font-weight: 400; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
  .btn.text { border-color: transparent; color: var(--primary); }
  .btn.sm { padding: 2px 8px; font-size: 12px; }
  .zoom { display: inline-flex; align-items: center; gap: 4px; }
  .zoom b { min-width: 44px; text-align: center; font-weight: 500; }
  .zoom .btn { min-width: 28px; padding: 3px 0; text-align: center; }
  .hint { color: var(--meta); font-size: 12px; }
  .kv { display: flex; align-items: center; gap: 8px; }
  .kv code { background: var(--code-bg); border: 1px solid var(--border-soft); padding: 1px 6px; border-radius: 3px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--surface-alt); color: var(--meta); border: 1px solid var(--border-soft); vertical-align: 2px; }
  .pill.ok { color: var(--ok); }
  .ladder { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 10px; align-items: center; }
  .ladder .btn { font-size: 11px; padding: 2px 6px; }
  .ladder code { color: var(--text-2); }
  .ladder .m { color: var(--meta); font-size: 12px; }
  .ladder .m.first { color: var(--text-2); }

  /* ---------- A: VS Code page ---------- */
  .vs { position: absolute; inset: 0; display: grid; grid-template-rows: 48px 1fr; background: var(--surface); }
  .vs .head { display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); }
  .vs .head .back { width: 28px; height: 28px; border-radius: 6px; border: 0; background: transparent; display: grid; place-items: center; color: var(--meta); cursor: pointer; }
  .vs .head .back:hover { background: var(--hover); color: var(--text); }
  .vs .head h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .vs .search { position: relative; margin-left: 12px; flex: 1; max-width: 460px; }
  .vs .search input { width: 100%; height: 30px; border: 1px solid var(--border); border-radius: 5px; background: var(--sunken); color: var(--text); padding: 0 30px 0 30px; font: inherit; }
  .vs .search input:focus { background: var(--surface); border-color: var(--focus); outline: none; }
  .vs .search svg { position: absolute; left: 9px; top: 8px; color: var(--meta); }
  .vs .search .count { position: absolute; right: 9px; top: 7px; font-size: 11px; color: var(--meta); }
  .vs .head .apply { margin-left: auto; color: var(--meta); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .vs .head .apply i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: block; }
  .vs .cols { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
  .vs .toc { border-right: 1px solid var(--border-soft); padding: 14px 0; overflow: auto; }
  .vs .toc a { display: block; padding: 5px 20px 5px 18px; color: var(--text-2); text-decoration: none; border-left: 2px solid transparent; cursor: pointer; }
  .vs .toc a.sub { padding-left: 32px; color: var(--meta); font-size: 12px; }
  .vs .toc a:hover { background: var(--hover); }
  .vs .toc a.on { color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
  .vs .list { overflow: auto; padding: 8px 32px 60px 26px; scroll-behavior: smooth; }
  .vs .sec { padding-top: 22px; }
  .vs .sec > .st { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .vs .sec > .sh { color: var(--meta); font-size: 12px; margin: 0 0 8px; }
  .vs .item { position: relative; padding: 10px 12px 12px 14px; margin: 2px 0; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; }
  .vs .item:hover { background: var(--sunken); }
  .vs .item .t { font-weight: 600; }
  .vs .item .t small { font-weight: 400; color: var(--meta); margin-left: 6px; }
  .vs .item .d { color: var(--meta); font-size: 12px; max-width: 70ch; }
  .vs .item .c { margin-top: 2px; }
  .vs .item.mod::before { content: ""; position: absolute; left: 2px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--primary); }
  .vs .item .reset { position: absolute; right: 10px; top: 10px; display: none; }
  .vs .item.mod:hover .reset { display: inline-block; }
  .vs .item.hide, .vs .sec.hide { display: none; }
  .vs .empty { color: var(--meta); padding: 40px 0; text-align: center; display: none; }
  .vs .chk { padding: 2px 0; }
  .vs .checks { display: flex; flex-direction: column; gap: 6px; }

  /* ---------- B: sidebar dialog ---------- */
  .dlg { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); display: grid; overflow: hidden; }
  .dlg .dt { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; }
  .dlg .dt .x { margin-left: auto; width: 26px; height: 26px; border-radius: 5px; border: 0; background: transparent; color: var(--meta); display: grid; place-items: center; cursor: pointer; }
  .dlg .dt .x:hover { background: var(--hover); color: var(--text); }
  .dlg .foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--sunken); }
  .dlg .foot .hint { margin-right: auto; }
  .sb { width: 900px; height: 600px; grid-template-rows: 40px 1fr auto; }
  .sb .mid { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .sb .side { background: var(--sunken); border-right: 1px solid var(--border-soft); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
  .sb .side a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 5px; color: var(--text-2); cursor: pointer; }
  .sb .side a svg { color: var(--meta); flex: none; }
  .sb .side a:hover { background: var(--hover); }
  .sb .side a.on { background: var(--sel-bg); color: var(--primary); font-weight: 600; }
  .sb .side a.on svg { color: var(--primary); }
  .sb .side .ver { margin-top: auto; color: var(--meta); font-size: 11px; padding: 8px 10px; }
  .sb .pane { overflow: auto; padding: 18px 26px 24px; }
  .ph { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; }
  .ph h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .ph .seg { margin-left: auto; }
  .psub { color: var(--meta); font-size: 12px; margin: 0 0 16px; max-width: 70ch; }
  .form { display: grid; grid-template-columns: 170px 1fr; gap: 12px 16px; align-items: start; }
  .form label.l { color: var(--text-2); padding-top: 6px; }
  .form .f { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .form .f .hint { max-width: 60ch; }
  .form .sel, .form .txt { min-width: 300px; }
  .form .grp { border-top: 1px solid var(--border-soft); grid-column: 1 / -1; height: 0; margin: 6px 0; }
  .form .checks { display: flex; flex-direction: column; gap: 7px; }

  /* ---------- C: toolbar tabs ---------- */
  .tb { width: 780px; height: 560px; grid-template-rows: 40px auto 1fr auto; }
  .tb .tabs { display: flex; gap: 2px; padding: 8px 10px 0; background: var(--sunken); border-bottom: 1px solid var(--border); }
  .tb .tab { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; padding: 8px 4px 7px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--text-2); cursor: pointer; font-size: 12px; margin-bottom: -1px; }
  .tb .tab svg { width: 20px; height: 20px; color: var(--meta); }
  .tb .tab:hover { background: var(--hover); }
  .tb .tab.on { background: var(--surface); border-color: var(--border); color: var(--primary); font-weight: 600; }
  .tb .tab.on svg { color: var(--primary); }
  .tb .pane { overflow: auto; padding: 18px 24px 22px; }
  .tb .form { grid-template-columns: 150px 1fr; }
  .tb .form .sel, .tb .form .txt { min-width: 260px; }

  /* ---------- notes ---------- */
  .notes { width: 1140px; max-width: 100%; margin: 26px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .note { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .note.pick { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
  .note h3 { margin: 0 0 2px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .note h3 .pill { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
  .note .who { color: var(--meta); font-size: 12px; margin: 0 0 10px; }
  .note dl { margin: 0; display: grid; grid-template-columns: 82px 1fr; gap: 6px 10px; font-size: 12.5px; }
  .note dt { color: var(--meta); }
  .note dd { margin: 0; color: var(--text-2); }
  .note dd b { color: var(--text); font-weight: 600; }
  .verdict { width: 1140px; max-width: 100%; margin: 14px auto 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; color: var(--text-2); }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .verdict p { margin: 0 0 6px; max-width: 90ch; }
  .verdict b { color: var(--text); font-weight: 600; }
</style>

<header class="top">
  <div>
    <h1>Settings — three layouts</h1>
    <div class="sub">Same settings, three surfaces. Click around: navigation, search and the scope switch work.</div>
  </div>
  <nav class="switch" role="tablist" aria-label="Prototype">
    <button data-proto="a" class="on">A · VS Code page</button>
    <button data-proto="b">B · Sidebar dialog</button>
    <button data-proto="c">C · Toolbar tabs</button>
  </nav>
  <div class="theme" role="group" aria-label="Theme">
    <button data-theme-pick="system" class="on">System</button>
    <button data-theme-pick="light">Light</button>
    <button data-theme-pick="dark">Dark</button>
  </div>
</header>

<main>
  <div class="lead" id="lead"></div>
  <section class="win" aria-label="PowerGit window">
    <div class="titlebar">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--primary)" stroke-width="1.8"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="8" cy="12" r="2"/><path d="M4 6v2a2 2 0 0 0 2 2h2M12 6v2a2 2 0 0 1-2 2H8"/></svg>
      PowerGit — powergit
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <div class="winbody">
      <div class="rail" id="rail"></div>
      <div class="content" id="content"></div>
    </div>
  </section>
  <section class="notes" id="notes"></section>
  <section class="verdict" id="verdict"></section>
</main>

<script>
(function () {
  // ---------- icons ----------
  const I = {
    appearance: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 2v12A6 6 0 0 0 8 2z" fill="currentColor" stroke="none"/></svg>',
    git: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5.5" r="3"/><path d="M2.5 14a5.5 5.5 0 0 1 11 0"/></svg>',
    tools: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10.6 2.4a3.4 3.4 0 0 0-3.9 4.7L2 11.8 4.2 14l4.7-4.7a3.4 3.4 0 0 0 4.7-3.9L11.4 7.6 8.4 4.6z"/></svg>',
    behaviour: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h12"/><circle cx="5.5" cy="4" r="1.7" fill="var(--surface)"/><circle cx="10.5" cy="8" r="1.7" fill="var(--surface)"/><circle cx="7" cy="12" r="1.7" fill="var(--surface)"/></svg>',
    diagnostics: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.5 8.5h3l2-4.5 3 8 2-3.5h3"/></svg>',
    updates: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 11.2V5M5.5 7.5 8 5l2.5 2.5"/></svg>',
    search: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>',
    back: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',

  // ---------- controls ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]))
  const sel = (options, value, extra = "") =>
    `<select class="sel" ${extra}>${options.map((o) => {
      const [label, disabled] = Array.isArray(o) ? o : [o, false]
      return `<option ${label === value ? "selected" : ""} ${disabled ? "disabled" : ""}>${esc(label)}</option>`
    }).join("")}</select>`
  const txt = (value, placeholder = "", mono = false) =>
    `<input class="txt ${mono ? "mono" : ""}" value="${esc(value)}" placeholder="${esc(placeholder)}">`
  const chk = (label, checked, desc = "") =>
    `<label class="chk"><input type="checkbox" ${checked ? "checked" : ""}><span><span class="t">${esc(label)}</span>${desc ? `<div class="d">${esc(desc)}</div>` : ""}</span></label>`
  const seg = (options, value, cls = "") =>
    `<span class="seg ${cls}" role="group">${options.map((o) => `<button type="button" class="${o === value ? "on" : ""}">${esc(o)}</button>`).join("")}</span>`
  const btn = (label, kind = "") => `<button type="button" class="btn ${kind}">${esc(label)}</button>`
  const zoom = () => `<span class="zoom">${btn("−")}<b>100 %</b>${btn("+")}${btn("Reset", "text sm")}</span>`

  // ---------- the settings, as they are in the app today (v0.17.0) ----------

  const RECOVERY = [
    [1, "queue_draw", "ask GTK to redraw the window"], [2, "thaw", "thaw the window's frozen update clock"],

  const TRY_FIRST = new Set([3, 6, 8])

  // The control for an item, shared by the three layouts.
  function control(it, compact) {
    switch (it.type) {
      case "select": return sel(it.options, it.value)
      case "text": return txt(it.value, it.placeholder || "", it.mono)
      case "zoom": return zoom()
      case "checks": return `<div class="checks">${it.checks.map(([l, c]) => chk(l, c)).join("")}</div>`
      case "kv": return `<div class="kv"><code>${esc(it.value)}</code><span class="pill ok">found</span></div><div style="margin-top:6px">${btn(it.button)}</div>`
      case "actions": return `<div style="display:flex;gap:8px;flex-wrap:wrap">${it.buttons.map((b) => btn(b)).join("")}</div>`
      case "recovery": return `<div class="ladder">${RECOVERY.map(([n, k, m]) =>
        `${btn(`Ctrl+Shift+F${n}`, "sm")}<code>${k}</code><span class="m ${TRY_FIRST.has(n) ? "first" : ""}">${esc(m)}${TRY_FIRST.has(n) ? " · try first" : ""}</span>`).join("")}</div>`
      case "updates": return `<div style="display:flex;align-items:center;gap:10px">${btn("Check for updates")}<span class="hint">You are up to date.</span></div>`
    }
    return ""
  }

  // ---------- A: VS Code-style page ----------
  function renderA(host) {
    host.innerHTML = `
      <div class="vs">

          <nav class="toc"></nav>

        </div>
      </div>`
    const toc = host.querySelector(".toc"), list = host.querySelector(".list")
    for (const s of SECTIONS) {
      toc.insertAdjacentHTML("beforeend", `<a data-sec="${s.id}">${s.title}</a>`)
      if (s.id === "behaviour") toc.insertAdjacentHTML("beforeend", `<a class="sub" data-sec="behaviour" data-item="confirm">Confirmations</a><a class="sub" data-sec="behaviour" data-item="autofetch">Background fetch</a>`)
      if (s.id === "diagnostics") toc.insertAdjacentHTML("beforeend", `<a class="sub" data-sec="diagnostics" data-item="recovery">Recovery ladder</a>`)
      const scopeCtl = s.scope === "git"
        ? seg(["This repository", "All repositories"], "This repository", "scope")
        : `<span class="pill">This app, every repository</span>`
      const hint = s.scope === "git" ? `<div class="sh">${esc(s.hint.local)}</div>` : ""
      list.insertAdjacentHTML("beforeend", `
        <section class="sec" id="a-${s.id}" data-sec="${s.id}">
          <h3 class="st">${s.title} ${scopeCtl}</h3>${hint}
          ${s.items.map((it) => `
            <div class="item ${it.mod ? "mod" : ""}" id="a-${s.id}-${it.id}" data-q="${esc((it.title + " " + it.desc + " " + (it.checks || []).map((c) => c[0]).join(" ")).toLowerCase())}">
              <div class="t">${esc(it.title)}${it.mod ? "<small>changed</small>" : ""}</div>
              ${it.desc ? `<div class="d">${esc(it.desc)}</div>` : ""}
              <div class="c">${control(it)}</div>
              <button class="btn sm reset" title="Reset to default">${I.undo} Reset</button>
            </div>`).join("")}
        </section>`)
    }
    // scope switch swaps the hint, like the app's identity re-read
    for (const s of SECTIONS) if (s.scope === "git") {
      const sec = host.querySelector(`#a-${s.id}`)
      sec.querySelectorAll(".scope button").forEach((b, i) => b.addEventListener("click", () => {
        sec.querySelectorAll(".scope button").forEach((x) => x.classList.toggle("on", x === b))
        sec.querySelector(".sh").textContent = i === 0 ? s.hint.local : s.hint.global
      }))
    }
    // a change marks the row, and the reset clears it
    list.addEventListener("change", (e) => { const it = e.target.closest(".item"); if (it) { it.classList.add("mod"); if (!it.querySelector(".t small")) it.querySelector(".t").insertAdjacentHTML("beforeend", "<small>changed</small>") } })
    list.querySelectorAll(".reset").forEach((b) => b.addEventListener("click", () => { const it = b.closest(".item"); it.classList.remove("mod"); const sm = it.querySelector(".t small"); if (sm) sm.remove() }))
    // TOC: click scrolls, scroll highlights
    const links = [...toc.querySelectorAll("a")]
    toc.addEventListener("click", (e) => {
      const a = e.target.closest("a"); if (!a) return
      const target = host.querySelector(a.dataset.item ? `#a-${a.dataset.sec}-${a.dataset.item}` : `#a-${a.dataset.sec}`)
      if (target) list.scrollTo({ top: target.offsetTop - 8, behavior: "smooth" })
    })
    const secs = [...list.querySelectorAll(".sec")]
    const mark = () => {
      let cur = secs[0]
      for (const s of secs) if (!s.classList.contains("hide") && s.offsetTop - 40 <= list.scrollTop) cur = s
      links.forEach((a) => a.classList.toggle("on", a.dataset.sec === cur.dataset.sec && !a.dataset.item))
    }
    list.addEventListener("scroll", mark); mark()
    // search
    const input = host.querySelector(".search input"), count = host.querySelector(".search .count"), empty = host.querySelector(".empty")
    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase(); let n = 0
      for (const s of secs) {
        let any = false
        for (const it of s.querySelectorAll(".item")) { const hit = !q || it.dataset.q.includes(q); it.classList.toggle("hide", !hit); if (hit) { any = true; n++ } }
        s.classList.toggle("hide", !any)
      }
      count.textContent = q ? `${n} setting${n === 1 ? "" : "s"}` : ""
      empty.style.display = n ? "none" : "block"
      links.forEach((a) => a.classList.toggle("hide", q && !secs.find((s) => s.dataset.sec === a.dataset.sec && !s.classList.contains("hide"))))
      mark()
    })
  }

  // ---------- shared: one section as a label/control form (B and C) ----------
  function formFor(s, scopeIdx) {
    const rows = s.items.map((it, i) => {
      const sepBefore = it.type === "checks" && i > 0 ? `<div class="grp"></div>` : ""
      const sepAfter = it.type === "checks" && i < s.items.length - 1 ? `<div class="grp"></div>` : ""
      const hint = it.type === "checks" || it.type === "kv" || it.type === "recovery" || !it.desc ? "" : `<span class="hint">${esc(it.desc)}</span>`
      return `${sepBefore}<label class="l">${esc(it.title)}</label><div class="f">${control(it, true)}${hint}</div>${sepAfter}`
    }).join("")
    const scopeCtl = s.scope === "git" ? seg(["This repository", "All repositories"], scopeIdx ? "All repositories" : "This repository", "scope") : ""
    const sub = s.scope === "git" ? s.hint[scopeIdx ? "global" : "local"] : "This app, every repository."
    return `<div class="ph"><h3>${s.title}</h3>${scopeCtl}</div><p class="psub">${esc(sub)}</p><div class="form">${rows}</div>`
  }

      <dt>Build</dt><dd>Same as B with a tab strip instead of a sidebar. ~half an iteration.</dd></dl></div>`
  const VERDICT = `<h3>My call</h3>
    <p><b>A.</b> Settings have doubled since v0.15.0 and review mode is about to add more; a page with search scales, a dialog does not. It also removes the one thing that keeps going wrong in this dialog — sizing a modal on Ubuntu at zoom — because there is no modal. The cost is the save model: VS Code applies immediately, and that replaces the v0.13.18 draft-until-Save behaviour (Cancel discards). The per-row Reset and the “changed” bar cover the same need without a footer.</p>
    <p>If you want to keep Save/Cancel, <b>B</b> is the same content with the smallest code change and could take A's search box above its sidebar later. C only if you value the compact footprint over room to grow.</p>`

  // ---------- wiring ----------
  const content = document.getElementById("content"), lead = document.getElementById("lead")
  const renderers = { a: renderA, b: renderB, c: renderC }
  function pick(p) {
    document.querySelectorAll(".switch button").forEach((b) => b.classList.toggle("on", b.dataset.proto === p))
    lead.innerHTML = LEAD[p]
    renderers[p](content)
    try { localStorage.setItem("pg.settings-proto", p) } catch (_) {}
  }
  document.querySelectorAll(".switch button").forEach((b) => b.addEventListener("click", () => pick(b.dataset.proto)))
  document.querySelectorAll(".theme button").forEach((b) => b.addEventListener("click", () => {
    const t = b.dataset.themePick
    document.querySelectorAll(".theme button").forEach((x) => x.classList.toggle("on", x === b))
    if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t)
  }))
  document.getElementById("notes").innerHTML = NOTES
  document.getElementById("verdict").innerHTML = VERDICT
  let initial = "a"
  try { initial = localStorage.getItem("pg.settings-proto") || "a" } catch (_) {}
  if (!renderers[initial]) initial = "a"
  pick(initial)
})()
</script>
