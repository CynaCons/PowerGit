  .list { overflow: auto; flex: 1; min-height: 0; }
  .foot { display: flex; align-items: center; gap: 14px; height: 34px; padding: 0 14px; border-top: 1px solid var(--border); background: var(--sunken); font-size: 12px; color: var(--meta); flex: none; }

  /* groups (B) */
  .group { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px; margin-top: 4px; font-family: var(--mono); font-size: 11px; color: var(--meta); background: var(--sunken); border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 1; }

  .tile .path { grid-column: 2 / span 2; font-family: var(--mono); font-size: 11px; color: var(--meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .tile .path bdi { unicode-bidi: plaintext; }
  .tile .path .shared { color: var(--disabled); }
  .tile .path .tail { color: var(--text-2); }
  .tile .x { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border: 0; background: transparent; border-radius: 4px; color: var(--meta); display: grid; place-items: center; cursor: pointer; visibility: hidden; }
  .tile:hover .x, .tile.cur .x { visibility: visible; }

  .p1 { background: var(--d1-bg); color: var(--d1-fg); } .p2 { background: var(--d2-bg); color: var(--d2-fg); } .p3 { background: var(--d3-bg); color: var(--d3-fg); }
  .p4 { background: var(--d4-bg); color: var(--d4-fg); } .p5 { background: var(--d5-bg); color: var(--d5-fg); } .p6 { background: var(--d6-bg); color: var(--d6-fg); }

  /* the toast that answers Enter */
  .toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 6px 12px; border-radius: 5px; font-size: 12px; z-index: 6; opacity: 0; transition: opacity 120ms ease; pointer-events: none; }
  .toast.on { opacity: 1; }

  /* the current (D) dialog, for comparison */
  .old { position: absolute; left: 50%; top: 90px; transform: translateX(-50%); width: 900px; background: var(--surface); border-radius: 4px; box-shadow: var(--shadow); z-index: 4; padding: 16px 24px 18px; }
  .old h3 { margin: 0 0 14px; font-size: 20px; font-weight: 500; }
  .old .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .old .card { border: 1px solid var(--border); border-radius: 4px; padding: 14px 40px 14px 16px; position: relative; }
  .old .card b { display: block; font-size: 15px; font-weight: 600; }
  .old .card i { display: block; font-style: normal; color: var(--meta); font-size: 13px; }
  .old .card small { display: block; color: var(--meta); font-size: 11.5px; margin-top: 4px; word-break: break-all; }
  .old .card em { position: absolute; top: 6px; right: 8px; font-style: normal; color: var(--meta); }
</style>

<script>
const I = {
  search: '<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>',
  branch: '<svg viewBox="0 0 24 24"><path d="M14 4l2.29 2.29-2.88 2.88 1.42 1.42 2.88-2.88L20 10V4zm-4 0H4v6l2.29-2.29 4.71 4.7V20h2v-8.41l-5.29-5.3z"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>',
};

/* recents.json as the engine keeps it: name, root, branch — newest first, 20 at most */
const SEED = [
  { name: 'PowerGit', root: 'C:\\dev\\public-repo\\powergit', branch: 'powergit', open: true },
  { name: 'gitextensions-ref', root: 'C:\\dev\\public-repo\\gitextensions-ref', branch: 'master' },
  { name: 'powerspawn', root: 'C:\\dev\\public-repo\\powerspawn', branch: 'main' },
  { name: 'website', root: 'C:\\dev\\work\\acme\\website', branch: 'release/2026-09' },
  { name: 'api', root: 'C:\\dev\\work\\acme\\api', branch: 'feature/rate-limits' },
  { name: 'powerplan', root: 'C:\\dev\\public-repo\\powerplan', branch: 'main' },
  { name: 'shiki', root: 'C:\\dev\\oss\\shiki', branch: 'main' },
  { name: 'tauri', root: 'C:\\dev\\oss\\tauri', branch: 'dev' },
  { name: 'api', root: 'C:\\dev\\work\\northwind\\api', branch: 'main' },
  { name: 'infra', root: 'C:\\dev\\work\\acme\\infra', branch: 'main' },
  { name: 'notes', root: 'C:\\Users\\cynak\\notes', branch: 'main' },
  { name: 'dotfiles', root: 'C:\\Users\\cynak\\dotfiles', branch: 'main' },
];

const state = { variant: 'A', items: SEED.map((r) => ({ ...r })), q: '', cur: 0, undo: null };
const VARIANTS = { A: 'The list', B: 'By folder', C: 'Tiles', D: 'Today' };
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const parent = (root) => root.slice(0, root.lastIndexOf('\\'));
/* Initials from the name's words, camel-case counted as words (PowerGit → PG,
   gitextensions-ref → GR, powerspawn → PO); the colour from the PATH, so two
   repositories called api never share a disc. */
const initials = (n) => { const w = n.replace(/([a-z0-9])([A-Z])/g, '$1 $2').split(/[\s\-_.]+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : n.slice(0, 2)).toUpperCase(); };
const palette = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return 'p' + ((h % 6) + 1); };

/* The part of the path every listed repository shares is dimmed; the last
   segment carries the ink. Recognition by path, not decoration. */
function sharedPrefix(items) {
  if (items.length < 2) return '';
  const parts = items.map((r) => r.root.split('\\'));
  let n = 0;
  while (parts.every((p) => p.length > n + 1 && p[n] === parts[0][n])) n++;
  return parts[0].slice(0, n).join('\\') + (n ? '\\' : '');
}
function pathHtml(root, shared, q) {
  const tailAt = root.lastIndexOf('\\') + 1;
  const sh = root.startsWith(shared) ? shared : '';
  const mid = root.slice(sh.length, tailAt);
  const tail = root.slice(tailAt);
  return `<bdi><span class="shared">${esc(sh)}</span>${mark(esc(mid), q)}<span class="tail">${mark(esc(tail), q)}</span></bdi>`;
}
function mark(html, q) {
  if (!q) return html;
  const i = html.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? html : html.slice(0, i) + '<span class="hl">' + html.slice(i, i + q.length) + '</span>' + html.slice(i + q.length);
}
function matches(r, q) {
  if (!q) return true;
  const s = q.toLowerCase();
  return r.name.toLowerCase().includes(s) || r.root.toLowerCase().includes(s) || r.branch.toLowerCase().includes(s);
}
function visible() { return state.items.filter((r) => matches(r, state.q.trim())); }

/* ---------- render ---------- */
function render() {
  $('variants').innerHTML = Object.entries(VARIANTS).map(([k, t]) => `<button data-variant="${k}" class="${k === state.variant ? 'on' : ''}"><b>${k}</b>${t}</button>`).join('');
  renderLead(); renderPicker(); renderNotes();
}
function renderLead() {
  const v = state.variant;
  const h = {
    A: `<h2>A · The list — a quick-open palette</h2>
      <p class="quote">"Can we improve the Recent repositories overlay?"</p>
      <p>The picker's one job is to get you back into the right repository in a second, with the keyboard, and to make <b>which one</b> unmistakable when three of them are called <code>api</code>. So the row is built from what identifies a repository: the name, then its <b>path</b> in the code face — the part every entry shares is dimmed, the folder you would say out loud is in ink — and the branch it was on. The panel opens where a command palette opens (top, not centre), the cursor is in the search box, and typing narrows by name, path or branch. <b>1–9</b> open the first nine outright; ↑ ↓ and Enter do the rest. The repository that is open now is a fact on its row, not a card you can re-open. <b>Recommended.</b></p>`,
    B: `<h2>B · By folder — the same list, grouped where you keep things</h2>
      <p>Twenty repositories usually live in three or four places. Grouping by parent folder turns the path into a heading (<code>C:\\dev\\work\\acme</code>) and lets every row be one line: name and branch. The group headers stay put while you scroll; typing filters inside them and hides the empty ones. Better when your roots are few and your names clash (two <code>api</code>s sit under different headings); weaker when every repository is in its own place — then every group has one row.</p>`,
    C: `<h2>C · Tiles — recognition by shape</h2>
      <p>Closest to today's layout, made flat: a hairline grid instead of cards with shadows, three across, and one bold element per tile — an initials disc coloured from the repository's name, the device the author discs use in the graph (v0.18.1). You find PowerGit by its blue <b>PG</b> before you read a word. Name and branch on the first line, the path's tail on the second, the key hint in the corner. The same search box and keys as A.</p>`,
    D: `<h2>D · Today — for comparison</h2>
      <p>The v0.4.6 dialog: a centred modal, two columns of outlined cards, name at 15 px, the branch and the full path underneath, a cross to forget. It is the one place the pre-v0.13.13 rounded-card kit survived. No search, no keyboard, no sign of which repository is open now, and the full path repeats <code>C:\\dev\\public-repo\\</code> on every card.</p>`,
  }[v];
  $('lead').innerHTML = h;
}
function renderPicker() {
  const v = state.variant;
  const list = visible();
  if (state.cur >= list.length) state.cur = Math.max(0, list.length - 1);
  const q = state.q.trim();
  const shared = sharedPrefix(state.items);
  const x = (r) => `<button class="x" data-forget="${esc(r.root)}" title="Remove from recent repositories" aria-label="Remove ${esc(r.name)} from recent repositories">${I.close}</button>`;
  const chip = (r) => `<span class="ref">${I.branch}${mark(esc(r.branch), q)}</span>`;
  const key = (i) => (i < 9 ? String(i + 1) : '');
  const search = `<div class="search">${I.search}<input id="q" type="text" value="${esc(state.q)}" placeholder="Type to filter by name, path or branch" aria-label="Filter recent repositories" autocomplete="off" spellcheck="false"><span class="esc"><kbd>Esc</kbd></span></div>`;
  const foot = `<div class="foot">${state.undo ? `<span class="undo">Removed ${esc(state.undo.name)} <a data-act="undo">Undo</a></span>` : `<span>${list.length === state.items.length ? `${state.items.length} repositories` : `${list.length} of ${state.items.length}`}</span>`}<span class="sp"></span><span class="hint"><kbd>↑</kbd><kbd>↓</kbd> move</span><span class="hint"><kbd>Enter</kbd> open</span><span class="hint"><kbd>1</kbd>–<kbd>9</kbd> jump</span><a data-act="open-folder">Open folder…</a></div>`;
  const empty = state.items.length === 0
    ? `<div class="empty"><b>No repositories yet</b>Open a folder and it will be listed here next time.</div>`
    : `<div class="empty"><b>Nothing matches "${esc(q)}"</b>Try part of the path or the branch name.</div>`;

  if (v === 'D') {
    $('picker').innerHTML = `<div class="old" role="dialog"><h3>Recent repositories</h3><div class="cards">${state.items.slice(0, 6).map((r) => `<div class="card"><b>${esc(r.name)}</b><i>${esc(r.branch)}</i><small>${esc(r.root)}</small><em>✕</em></div>`).join('')}</div></div>`;
    return;
  }
  let body = '';
  if (list.length === 0) body = empty;
  else if (v === 'A') {
    body = list.map((r, i) => `<div class="row two ${i === state.cur ? 'cur' : ''}" data-i="${i}" data-root="${esc(r.root)}"><span class="key">${key(i)}</span><div class="main"><div class="name"><span>${mark(esc(r.name), q)}</span>${chip(r)}${r.open ? '<span class="open-now">open now</span>' : ''}${i === 0 ? '<span class="mark">1</span>' : ''}${i === 1 ? '<span class="mark">2</span>' : ''}</div><div class="path">${pathHtml(r.root, shared, q)}</div></div><span></span>${x(r)}</div>`).join('');
  } else if (v === 'B') {
    const groups = new Map();
    list.forEach((r, i) => { const p = parent(r.root); if (!groups.has(p)) groups.set(p, []); groups.get(p).push({ r, i }); });
    for (const [p, rows] of groups) {
      body += `<div class="group">${I.folder}<span>${mark(esc(p), q)}</span><span class="n">${rows.length}</span>${p === parent(list[0].root) ? '<span class="mark">1</span>' : ''}</div>`;
      body += rows.map(({ r, i }) => `<div class="row one ${i === state.cur ? 'cur' : ''}" data-i="${i}" data-root="${esc(r.root)}"><span class="key">${key(i)}</span><div class="main"><div class="name"><span>${mark(esc(r.name), q)}</span>${chip(r)}${r.open ? '<span class="open-now">open now</span>' : ''}${i === 4 ? '<span class="mark">2</span>' : ''}</div></div><span></span>${x(r)}</div>`).join('');
    }
  } else {
    body = `<div class="tilegrid">${list.map((r, i) => `<div class="tile ${i === state.cur ? 'cur' : ''}" data-i="${i}" data-root="${esc(r.root)}"><span class="disc ${palette(r.root)}">${initials(r.name)}</span><div class="name"><span>${mark(esc(r.name), q)}</span>${chip(r)}${i === 0 ? '<span class="mark">1</span>' : ''}</div><span class="key">${key(i)}</span><div class="path">${pathHtml(r.root, shared, q)}${r.open ? ' <span class="open-now">open now</span>' : ''}</div>${x(r)}</div>`).join('')}</div>`;
  }
  $('picker').innerHTML = `<div class="pick ${v === 'C' ? 'tiles' : 'palette'}" role="dialog" aria-label="Recent repositories">${search}<div class="list" id="list">${body}</div>${foot}</div>`;
  const input = $('q');
  if (input && document.activeElement !== input && !state.blurred) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }

  if (curEl) curEl.scrollIntoView({ block: 'nearest' });
}
function renderNotes() {
  const v = state.variant;
  const li = (n, t) => `<li><span class="mark">${n}</span><span>${t}</span></li>`;
  const bl = (t) => `<li><span>${t}</span></li>`;
  let a = '', b = '';
  if (v === 'A') {
    a = li(1, `<b>The row is an identity, not a card.</b> Name at 500, the branch chip from the graph (fork glyph, v0.18.3), "open now" on the repository you are in; the path in the code face with the shared root (<code>C:\</code> here; all of <code>C:\dev\</code> when everything sits under it) dimmed and <code>powergit</code> in ink because that is the word you are looking for. Two <code>api</code>s stop looking alike.`)
      + li(2, `<b>Keys on the left, forget on the right.</b> 1–9 are real bindings (the first nine rows), so the numbers carry information; the cross appears on hover and on the cursor row, and the footer offers Undo for five seconds instead of asking "are you sure?".`);
    b = bl(`<b>Component:</b> <code>RecentsDialog.tsx</code> keeps its props (<code>recents</code>, <code>onPick</code>, <code>onForget</code>) and its test ids (<code>recent-card</code> becomes the row, <code>recent-forget</code> the cross); a MUI <code>Dialog</code> with <code>PaperProps</code> anchored at the top (<code>sx: { position: "absolute", top: 64 }</code>) and a plain list, no <code>Card</code>. The filter and the cursor are local state; <code>sharedPrefix</code> and the match are two pure functions with a unit test.`)
      + bl(`<b>Keys:</b> the dialog owns them while open (the browse layer is already silent under a dialog): ↑ ↓ move, Enter opens the cursor row, 1–9 open that row, Esc clears the filter then closes, Delete forgets the cursor row. Focus starts in the search box.`)
      + bl(`<b>Undo:</b> <code>forgetRecent</code> already removes for good; Undo re-adds through <code>POST /repos/recents</code> (a small engine route, <code>RecentsStore.Remember</code> exists) — or the dialog delays the DELETE by five seconds and Undo cancels it, no engine change. The second is the plan's default.`)
      + bl(`<b>Cost:</b> a day: the component, the two pure functions and their tests, <code>recents.spec.ts</code> extended with type-to-filter, Enter and 1–9; visual baseline for the dialog.`);
  }
  if (v === 'B') {
    a = li(1, `<b>The folder is the heading</b> — in the code face, with the count; sticky while the list scrolls; the filter hides groups with no match.`)
      + li(2, `<b>One-line rows</b>: name, branch, "open now". The path is not repeated because the heading says it; the cross and the key hint are as in A.`);
    b = bl(`<b>Same component as A</b> plus a <code>groupByParent</code> pure function (sorted by most recent member, so the group you used last is on top); 1–9 still number the rows in list order, not per group.`)
      + bl(`<b>When it is worse:</b> twelve repositories in twelve folders is twelve headings for twelve rows. A rule can fall back to A's flat rows when no group has two members.`)
      + bl(`<b>Cost:</b> A plus half a day.`);
  }
  if (v === 'C') {
    a = li(1, `<b>The disc</b> is the one bold element: initials from the name, colour from a stable hash of the path onto the six badge pairs (so two <code>api</code>s differ) — the same device and palette as the author discs, so it already belongs to the app. The grid is hairlines, not shadows; three across at 760 px, two at a narrower window.`);
    b = bl(`<b>Same keys and search as A</b>; the cursor moves with ← → as well; <code>repoIdentity</code> reuses <code>graph/authorIdentity.ts</code>'s hash and initials.`)
      + bl(`<b>Trade-off:</b> the path tail gets one line and is the first thing to be cut; two <code>api</code>s are told apart by the disc colour and the tail (<code>acme\\api</code> vs <code>northwind\\api</code>), not by reading.`)
      + bl(`<b>Cost:</b> A plus a few hours for the grid and the disc.`);
  }
  if (v === 'D') {
    a = li(1, `Cards with a radius and a border on a modal, a title at 20 px, no search, no keys, no "open now", the full path on every card.`);
    b = bl(`Kept here so the three proposals are judged against what ships today.`);
  }
  $('notes').innerHTML = `<div><h3>What you are looking at</h3><ol>${a}</ol></div><div><h3>How it would be built</h3><ul>${b}</ul></div>`;
}

/* ---------- interactions ---------- */
let toastTimer = null, undoTimer = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600); }
function openIndex(i) { const list = visible(); const r = list[i]; if (!r) return; toast(r.open ? `${r.name} is already open` : `Opening ${r.name} on ${r.branch}…`); }
function forget(root) {
  const idx = state.items.findIndex((r) => r.root === root); if (idx < 0) return;
  const [r] = state.items.splice(idx, 1);
  state.undo = { ...r, idx };
  clearTimeout(undoTimer); undoTimer = setTimeout(() => { state.undo = null; renderPicker(); }, 5000);
  renderPicker();
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-variant],[data-t],[data-forget],[data-act],[data-i]');
  if (!t) return;
  if (t.dataset.variant) { state.variant = t.dataset.variant; state.q = ''; state.cur = 0; state.blurred = false; return render(); }
  if (t.dataset.t) { const v = t.dataset.t; document.documentElement.removeAttribute('data-theme'); if (v !== 'system') document.documentElement.setAttribute('data-theme', v); document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === v)); return; }
  if (t.dataset.forget !== undefined) { e.stopPropagation(); return forget(t.dataset.forget); }
  if (t.dataset.act === 'undo') { const u = state.undo; if (u) { state.items.splice(Math.min(u.idx, state.items.length), 0, { name: u.name, root: u.root, branch: u.branch, open: u.open }); state.undo = null; clearTimeout(undoTimer); renderPicker(); } return; }
  if (t.dataset.act === 'open-folder') return toast('The folder picker opens here');
  if (t.dataset.i !== undefined) { state.cur = +t.dataset.i; renderPicker(); return openIndex(state.cur); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { state.q = e.target.value; state.cur = 0; renderPicker(); } });
document.addEventListener('focusin', (e) => { if (e.target.id === 'q') state.blurred = false; });
document.addEventListener('keydown', (e) => {
  if (state.variant === 'D') return;
  const inWin = e.target.closest && (e.target.closest('#win') || e.target === document.body);
  if (!inWin) return;
  const list = visible();
  const cols = state.variant === 'C' ? 3 : 1;
  if (e.key === 'ArrowDown') { e.preventDefault(); state.cur = Math.min(list.length - 1, state.cur + cols); renderPicker(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); state.cur = Math.max(0, state.cur - cols); renderPicker(); }
  else if (e.key === 'ArrowRight' && cols > 1 && e.target.id === 'q' && e.target.selectionStart === e.target.value.length) { e.preventDefault(); state.cur = Math.min(list.length - 1, state.cur + 1); renderPicker(); }
  else if (e.key === 'ArrowLeft' && cols > 1 && e.target.id === 'q' && e.target.selectionStart === 0) { e.preventDefault(); state.cur = Math.max(0, state.cur - 1); renderPicker(); }
  else if (e.key === 'Enter') { e.preventDefault(); openIndex(state.cur); }
  else if (e.key === 'Escape') { e.preventDefault(); if (state.q) { state.q = ''; state.cur = 0; renderPicker(); } else toast('Closes the picker'); }
  else if (e.key === 'Delete' && e.target.id === 'q' && !state.q) { const r = list[state.cur]; if (r) forget(r.root); }
  else if (/^[1-9]$/.test(e.key) && !(e.target.id === 'q' && state.q)) { e.preventDefault(); openIndex(+e.key - 1); }
});
render();
</script>
