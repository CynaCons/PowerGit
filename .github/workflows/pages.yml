name: pages

on:
  push:
    branches: [powergit]
    paths:
      - "website/**"
      - "docs/site/**"
      - "frontend/src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            website/package-lock.json

      - name: Build showcase site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Build live demo (real app, synthetic data)
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b --force
          npm exec vite -- build --base=/PowerGit/demo/

      - name: Assemble site
        run: |
          mkdir -p site/demo
          cp -r website/dist/* site/
          cp -r frontend/dist/* site/demo/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
