name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sidecar + app + package (signed for the updater)
        shell: pwsh
        # v0.14.0: the installer is signed so the in-app updater can verify
        # it; createUpdaterArtifacts is passed here rather than committed so
        # local package-windows.ps1 runs never need the private key.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          POWERGIT_SIGN: "1"
        run: scripts/package-windows.ps1
      - name: Keep the installer signature for the manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-sig
          path: dist/*-setup.exe.sig
          if-no-files-found: error
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*-setup.exe.sig

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine sidecar
        run: |
          chmod +x scripts/build-engine-sidecar.sh
          scripts/build-engine-sidecar.sh x86_64-unknown-linux-gnu
      - name: Build app (AppImage + deb)
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build
      - name: Inspect AppImage for host-provided library families (strict) and repack
        # Host-vs-bundle policy lives in scripts/inspect-appimage.sh: GLib/GIO,
        # util-linux (libmount/libblkid/libuuid), Wayland client libs,
        # GStreamer and curl/nghttp2 must never ship — the host webkit2gtk
        # stack provides them and a bundled older copy breaks at load on a
        # newer distro (v0.12.3: `MOUNT_2_40' not found on Ubuntu 26.04).
        # --strict fails on presence even when symbols resolve on this runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools binutils libfuse2 python3
          chmod +x scripts/inspect-appimage.sh
          scripts/inspect-appimage.sh --self-test
          APP=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          scripts/inspect-appimage.sh "$APP" --fix --strict
      - name: Launch AppImage in stock Ubuntu 22.04 / 24.04 / 26.04 containers (runtime guard)
        # Static inspection only catches known mismatch classes; this RUNS
        # the exact artifact that gets uploaded on the package versions a
        # real user has (not the runner's updated stack), on every supported
        # Ubuntu LTS, and fails unless the engine answers /health, the process
        # survives the smoke interval and stderr carries no dependency error.
        # See docker/appimage-check/run-matrix.sh and
        # docs/agents/memories/appimage-compat-matrix.md.
        run: |
          chmod +x docker/appimage-check/run-matrix.sh docker/appimage-check/launch.sh
          APP=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          docker/appimage-check/run-matrix.sh "$APP" --out /tmp/appimage-matrix
      - name: Upload matrix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-matrix-logs
          path: /tmp/appimage-matrix/**/app.std*.txt
          if-no-files-found: ignore
      - name: Sign the repaired AppImage for the updater
        # v0.14.0: inspect-appimage.sh --fix repacked the file, so the
        # signature tauri build wrote no longer matches; sign what ships.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: frontend
        run: |
          APP=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          rm -f "$APP.sig"
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$APP"
          test -s "$APP.sig"
      - name: Keep the AppImage signature for the manifest
        uses: actions/upload-artifact@v4
        with:
          name: linux-sig
          path: frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            frontend/src-tauri/target/release/bundle/deb/*.deb

  manifest:
    # v0.14.0: latest.json is what the app's "Check for updates" reads
    # (releases/latest/download/latest.json). Built once both signed
    # artifacts exist, so a half-built release never advertises itself.
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-sig
          path: sigs
      - uses: actions/download-artifact@v4
        with:
          name: linux-sig
          path: sigs
      - name: Assemble latest.json
        run: |
          node scripts/build-updater-manifest.mjs --tag "${GITHUB_REF_NAME}"             --linux-sig sigs/*.AppImage.sig --windows-sig sigs/*-setup.exe.sig --out latest.json
          node scripts/check-version.mjs --tag "${GITHUB_REF_NAME}" --manifest latest.json
          cat latest.json
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
