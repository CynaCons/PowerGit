name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sidecar + app + package
        shell: pwsh
        run: scripts/package-windows.ps1
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine sidecar
        run: |
          chmod +x scripts/build-engine-sidecar.sh
          scripts/build-engine-sidecar.sh x86_64-unknown-linux-gnu
      - name: Build app (AppImage + deb)
        working-directory: frontend
        run: |
          npm ci
          npm run tauri build
      - name: Inspect AppImage for GLib/GIO/curl bundling mismatches
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools binutils libfuse2
          chmod +x scripts/inspect-appimage.sh
          APP=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          scripts/inspect-appimage.sh "$APP" --fix
      - name: Launch AppImage in stock Ubuntu container (runtime dependency guard)
        # Static inspection can only catch known mismatch classes; this
        # actually RUNS the shipped AppImage on a stock ubuntu:22.04 image
        # (package versions a real user has, not the runner's updated stack)
        # and fails on any runtime dependency error on stderr.
        run: |
          APP=$(ls frontend/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          cp "$APP" /tmp/PowerGit.AppImage
          docker run --rm -v /tmp/PowerGit.AppImage:/app/PowerGit.AppImage ubuntu:22.04 bash -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 \
              xvfb ca-certificates xdg-utils >/dev/null
            export NO_AT_BRIDGE=1
            chmod +x /app/PowerGit.AppImage
            set +e
            timeout 30 xvfb-run -a /app/PowerGit.AppImage --appimage-extract-and-run \
              >/tmp/app.out 2>/tmp/app.err
            set -e
            echo "== app stderr =="
            cat /tmp/app.err
            if grep -E "undefined symbol|Failed to load module" /tmp/app.err; then
              echo "AppImage emitted runtime dependency errors" >&2
              exit 1
            fi
            echo "runtime guard OK"
          '
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
