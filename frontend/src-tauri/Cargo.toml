[package]
name = "powergit"
version = "0.0.0" # placeholder: the real version is frontend/package.json (build.rs exports POWERGIT_VERSION, tauri.conf.json points at it)
description = "PowerGit — Git Extensions UI on Tauri"
authors = ["CynaCons"]
edition = "2021"

[lib]
name = "powergit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"
# Sidecar restart backoff (tauri already runs on tokio).
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
zip = "4"
tauri-plugin-opener = "2"

# v0.14.2 crash hooks (crash_hooks.rs): the platform's own "web process
# died" signal, handed to the watchdog. Versions follow what tauri links.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
# v0.15.6 paint probe + recovery ladder (probe.rs, recovery.rs): the main
# toplevel's GdkFrameClock, draw signals, X11 frame sync. Same versions tauri
# links (already in Cargo.lock).
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
