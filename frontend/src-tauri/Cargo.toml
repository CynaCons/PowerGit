[package]
name = "powergit"
version = "0.0.0" # placeholder: the real version is frontend/package.json (build.rs exports POWERGIT_VERSION, tauri.conf.json points at it)
description = "PowerGit — Git Extensions UI on Tauri"
authors = ["CynaCons"]
edition = "2021"

[lib]
name = "powergit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
hex = "0.4"
