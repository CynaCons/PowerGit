<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <!-- Fonts are self-hosted (public/fonts, @font-face in tokens.css): no CDN
         request can stall first paint or degrade offline/packaged rendering.
         Only Fira Code is preloaded: since the UI stack now leads with the
         platform font (system-ui/Segoe UI/Ubuntu, as VS Code does), Inter is
         a fallback that usually never loads, and preloading it would fetch
         bytes no glyph is drawn from. See docs/agents/memories/linux-fonts.md. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/firacode-latin-400.woff2" crossorigin />
    <title>PowerGit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
