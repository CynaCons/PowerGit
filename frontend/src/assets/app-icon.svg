  <path d="M16 17c11 0 13 7 16 15s5 15 16 15" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M16 47c11 0 13-7 16-15s5-15 16-15" fill="none" stroke="#9fd5ff" stroke-width="10" stroke-linecap="round"/>
